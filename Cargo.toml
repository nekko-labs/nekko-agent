[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nekko-labs/nekko-agent"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# The collator V8's `localeCompare` uses (root collation), so sorted lists match JavaScript's.
icu_collator = "2"
libc = "0.2"
# Substring search for grep's literal fast path.
memchr = "2"
ndarray = "0.17"
# Pinned: ort 2 is still a release candidate and minor bumps change the API.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native", "api-22"] }
portable-pty = "0.9"
# ECMAScript regular expressions (JavaScript's `new RegExp`), matched over UTF-16 like V8 does.
regress = { version = "0.12", features = ["utf16"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Code mode's sandbox: QuickJS, no loader, no std modules, so its code reaches nothing but the bindings it is given.
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: a decision's option order is its meaning (criteria dicts), and Laya's input is the state serialized in the order the caller wrote it.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

# Debug and test builds keep file:line in backtraces but drop variable-level
# debug info, and dependencies carry none. Full debug info made each checkout's
# target/ tens of GB (mostly .pdb and the incremental cache). For a debugger
# session: CARGO_PROFILE_DEV_DEBUG=full cargo build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# `npm run dev`'s daemon: optimized like release, but without LTO and with
# incremental compilation, so a one-file change rebuilds in seconds rather than
# a minute. Never packaged (stage-daemon.mjs only stages release).
[profile.dev-daemon]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
strip = false
