  { id: 'c', title: 'Benchmark quantizations', on: 'gomi', st: 'run', model: 'Qwen 3.6 27B', prov: 'Local', proj: 'benchmarks' },
  { id: 'd', title: 'Audit sandbox policy', on: 'local', st: 'run', model: 'Gemma 4 31B', prov: 'Local', proj: 'nekko-agent' },
  { id: 'e', title: 'Refactor relay client', on: 'studio', st: 'run', model: 'Llama 4 Behemoth', prov: 'Local', proj: 'nekko-agent' },
  { id: 'f', title: 'Summarize CI flakes', on: 'studio', st: 'err', model: 'Opus 5.5', prov: 'Claude plan', proj: 'nekko-agent' },
  { id: 'g', title: 'Persist quota history', on: 'local', st: 'done', model: 'Opus 5.5', prov: 'Claude plan', proj: 'nekko-agent' },
  { id: 'h', title: 'Rebuild model catalog', on: 'gomi', st: 'done', model: 'GPT-5.5', prov: 'ChatGPT (subscription)', proj: 'nekko-agent' },
];
const STATUS = { needs: 'Needs input', run: 'Working', err: 'Error', done: 'Done' };
const SICON = { needs: ICON.q, run: ICON.run, err: ICON.err, done: ICON.ok };

const SCENES = [
  ['activity', '1 Agents, by activity', '<b>The default.</b> Everything from every computer, in one list, needs-input first. Remote cards name their computer on the provider line, so cards keep their height. Local cards stay as they are today. Click cards to open them. Try the sliders button.'],
  ['computer', '2 Group by computer', '<b>Optional grouping,</b> in the existing view menu. One header per computer, with its state and route, and a <b>+</b> to start an agent there. The Group by menu is open: pick another to compare.'],
  ['new', '3 New agent, run on', '<b>Where it runs is the first choice,</b> as on the iPhone. Pick a computer: the models, subscriptions and folders below change to that computer\'s. GPU memory is live, so you can see what fits.'],
  ['remote', '4 A remote window', '<b>The computer is named on the window, the approval and the button.</b> The Monitors dock switches computer; Hardware, Local models and Utilization all follow.'],
  ['offline', '5 Computer offline', '<b>gomi went to sleep.</b> Its cards stay, dimmed, with its last turns readable. The composer says why it is off. It reconnects by itself and catches up on any running turn.'],
  ['settings', '6 Settings, Computers', '<b>The list of what is connected,</b> how, and how healthy. This Mac stays out of the list; the section below it makes the link for the other direction.'],
  ['add', '7 Add a computer', '<b>Paste a link from the other computer.</b> Click through it. Phase 5 replaces the paste with a list of what is on your network and a code to compare.'],
];

const S = { scene: 'activity', groupBy: 'status', showComputer: true, menu: null, sub: null, sel: 'a', dock: 'gomi', offline: false, runOn: 'gomi', picker: true, addStep: 0 };
const on = (id) => COMPUTERS[id];
const isOff = (id) => S.offline && id === 'gomi';

function chip(id, big) {
  const c = on(id), off = isOff(id);
  return `<span class="chip${big ? ' big' : ''}${off ? ' off' : ''}" style="--c:${c.color}">${ICON[c.glyph]}${c.name}</span>`;
}
function card(a) {
  const remote = a.on !== 'local';
  const cls = ['card', S.sel === a.id ? 'sel' : '', a.st === 'needs' ? 'needs' : '', isOff(a.on) ? 'dim' : ''].join(' ');
  const prov = remote && S.showComputer ? `${chip(a.on)}<span>· ${a.prov}</span>` : a.prov;
  return `<button class="${cls}" data-sel="${a.id}"><div class="ctitle"><span class="ico">${SICON[a.st]}</span><span>${a.title}</span></div><div class="cmodel">${a.model}</div><div class="cprov">${prov}</div></button>`;
}
function groups() {
  const live = AGENTS.filter((a) => a.st !== 'done');
  const done = AGENTS.filter((a) => a.st === 'done');
  const section = (title, list, meta = '', add = '') => `<div class="grp"><div class="ghead">${ICON.chev}<span>${title}</span>${meta ? `<span class="meta">${meta}</span>` : ''}${add}</div>${list.length ? list.map(card).join('') : '<div class="none">No active agents</div>'}</div>`;
  if (S.groupBy === 'status') return ['needs', 'run', 'err', 'done'].map((k) => section(STATUS[k], AGENTS.filter((a) => a.st === k))).join('');
  if (S.groupBy === 'computer') {
    const rows = Object.keys(COMPUTERS).map((id) => {
      const c = on(id), off = isOff(id);
      const meta = id === 'local' ? '' : off ? `<i class="dot off"></i>offline 12m` : `<i class="dot"></i>${c.route}`;
      const add = off ? '' : `<button class="add" title="New agent on ${c.name}" data-go="new" data-on="${id}">${ICON.plus}</button>`;
      return section(c.name, live.filter((a) => a.on === id), meta, add);
    });
    return rows.join('') + section('Completed', done);
  }
  if (S.groupBy === 'project') {
    const p = [...new Set(AGENTS.map((a) => `${a.on}/${a.proj}`))];
    return p.map((k) => { const [id, n] = k.split('/'); return section(n, AGENTS.filter((a) => a.on === id && a.proj === n), id === 'local' ? '' : chip(id)); }).join('');
  }
  if (S.groupBy === 'date') return section('Today', live) + section('Yesterday', done);
  return section('All agents', AGENTS);
}
function panel() {
  return `<div class="panel"><div class="tools"><button title="Collapse">${ICON.side}</button><span class="sp"></span><button class="${S.menu ? 'on' : ''}" data-menu title="View options: group, sort and show">${ICON.sliders}</button><button title="Search">${ICON.search}</button><button class="plus" title="New agent" data-go="new">${ICON.plus}</button></div><div class="groups">${groups()}</div></div>`;
}
function viewMenu() {
  if (!S.menu) return '';
  const labels = { status: 'Activity', project: 'Project', date: 'Date', computer: 'Computer', none: 'None' };
  const top = `<div class="menu" style="left:250px;top:92px"><button class="${S.sub === 'group' ? 'open' : ''}" data-sub="group"><span>Group by</span><small>${labels[S.groupBy]} ${ICON.right}</small></button><button><span>Sort by</span><small>Manual ${ICON.right}</small></button><button class="${S.sub === 'show' ? 'open' : ''}" data-sub="show"><span>Show</span><small>${ICON.right}</small></button><hr><button disabled style="color:var(--ink-faint)">Reset to defaults</button></div>`;
  const opt = (k, l, tag) => `<button data-group="${k}"><span>${l}${tag ? '<span class="new">New</span>' : ''}</span>${S.groupBy === k ? `<span class="ck">${ICON.check}</span>` : ''}</button>`;
  const sub = S.sub === 'group' ? `<div class="menu" style="left:484px;top:92px">${opt('status', 'Activity')}${opt('project', 'Project')}${opt('computer', 'Computer', true)}${opt('date', 'Date')}${opt('none', 'None')}</div>`
    : S.sub === 'show' ? `<div class="menu" style="left:484px;top:150px"><button><span>Metadata</span><span class="ck">${ICON.check}</span></button><button><span>Model provider</span><span class="ck">${ICON.check}</span></button><button data-toggle-chip><span>Computer<span class="new">New</span></span>${S.showComputer ? `<span class="ck">${ICON.check}</span>` : ''}</button><hr><button><span>Automations</span><span class="ck">${ICON.check}</span></button><button><span>Empty groups</span><span class="ck">${ICON.check}</span></button></div>` : '';
  return top + sub;
}
function transcript(a) {
  const c = on(a.on);
  if (a.id === 'a') return `<div class="msg me">The nightly build is red on main. Find out why.</div><div class="tool">read_file  logs/nightly.txt</div><div class="tool">run  cargo check -p nekko-remote</div><div class="msg">The failure is a stale lockfile after the tungstenite bump. I can confirm it by running the tests for that crate.</div>${isOff(a.on) ? '' : `<div class="approve"><p>${chip(a.on)} <b>wants to run a command</b></p><code>cargo test -p nekko-remote --release</code><div class="row"><button class="btn pri">Allow on ${c.name}</button><button class="btn">Deny</button><span class="unread">Checked against ${c.name}'s guardrails</span></div></div>`}`;
  if (a.st === 'run') return `<div class="msg me">${a.title}.</div><div class="tool">run  scripts/run-suite.sh</div><div class="msg">Working through the second of four passes.</div>`;
  if (a.st === 'err') return `<div class="msg me">${a.title}.</div><div class="msg">Stopped: the provider returned an error.</div>`;
  if (a.st === 'needs') return `<div class="msg me">${a.title}.</div><div class="msg">Should the session token rotate on every refresh, or only at sign-in?</div>`;
  return `<div class="msg me">${a.title}.</div><div class="msg">Done. Checks pass.</div>`;
}
function win(a, selected) {
  const off = isOff(a.on);
  const banner = off ? `<div class="banner"><i class="dot off"></i><span><b style="color:var(--ink)">gomi went offline 12 minutes ago.</b> Showing its last turns. Reconnecting by itself.</span></div>` : '';
  const comp = off ? `<div class="composer"><span>gomi is offline</span><div class="foot"><span class="sp"></span><span class="m">${a.model}</span></div></div>`
    : `<div class="composer"><span>Message ${a.on === 'local' ? 'the agent' : 'the agent on ' + on(a.on).name}</span><div class="foot"><span>+</span><span class="sp"></span><span class="m">${a.model}</span><span>${a.prov}</span></div></div>`;
  return `<section class="win ${selected ? 'sel' : ''}"><div class="strip"><span class="ico">${SICON[a.st]}</span><span class="t">${a.title}</span>${a.on === 'local' ? '' : chip(a.on, true)}<span class="sp"></span><span class="x">${ICON.dots}</span><span class="x">${ICON.x}</span></div>${banner}<div class="body">${transcript(a)}</div>${comp}</section>`;
}
function wall() {
  const sel = AGENTS.find((a) => a.id === S.sel) || AGENTS[0];
  if (S.scene === 'new') return `<main class="wall" style="grid-template-rows:1fr">${newAgent()}</main>`;
  if (S.scene === 'remote') return `<main class="wall" style="grid-template-rows:1fr">${win(sel, true)}</main>`;
  const other = AGENTS.find((a) => a.id === (sel.id === 'c' ? 'd' : 'c'));
  return `<main class="wall" style="grid-template-columns:1fr 1fr">${win(sel, true)}${win(other, false)}</main>`;
}
function newAgent() {
  const c = on(S.runOn);
  const list = Object.keys(COMPUTERS).map((id) => {
    const x = on(id), off = isOff(id);
    return `<button class="${S.runOn === id ? 'on' : ''}" data-run="${id}" ${off ? 'disabled' : ''}><span style="color:${x.color}">${ICON[x.glyph]}</span><span>${x.name}<small>${x.sub}</small></span><small>${off ? 'Offline' : x.free}</small></button>`;
  }).join('');
  return `<div class="newagent"><h2>What should the agent do?</h2><div class="prompt"><span style="color:var(--ink-faint)">Describe the task</span></div><div class="detail"><span>Run on</span><button class="pick" data-picker><span style="color:${c.color};display:grid">${ICON[c.glyph].replace('<svg', '<svg width="15" height="15"')}</span><span>${c.name}</span><small>${c.sub}</small><span class="sp"></span><small>${c.free}</small></button>${S.picker ? `<div class="pop">${list}</div>` : ''}<span>Model</span><button class="pick"><span>${c.pick[0][0]}</span><small>${c.pick[0][1]}</small><span class="sp"></span>${ICON.chev.replace('class="chev"', 'width="10" height="10"')}</button><span>Also here</span><div class="unread">${c.pick.slice(1).map((m) => `${m[0]} (${m[1]})`).join(', ')}</div><span>Folder</span><button class="pick"><span class="mono" style="font-size:12px">${c.folders[0]}</span><span class="sp"></span>${ICON.chev.replace('class="chev"', 'width="10" height="10"')}</button></div><div class="row end"><button class="btn pri">Start on ${c.name}</button></div></div>`;
}
function dock() {
  const c = on(S.dock), off = isOff(S.dock);
  const tabs = Object.keys(COMPUTERS).map((id) => `<button class="${S.dock === id ? 'on' : ''}" data-dock="${id}"><span style="color:${on(id).color};display:grid">${ICON[on(id).glyph]}</span>${on(id).short}</button>`).join('');
  const body = off ? `<div class="mon"><h3>Hardware</h3><div class="unread">gomi is offline. Last reading 12 minutes ago.</div></div>`
    : `<div class="mon"><h3>Hardware</h3>${c.hw.map(([k, v]) => `<div class="bar"><div><span>${k}</span><span>${v}%</span></div><i><b style="width:${v}%"></b></i></div>`).join('')}</div>
       <div class="mon"><h3>Local models</h3>${c.models.map(([k, v]) => `<div class="kv"><b>${k}</b><span>${v}</span></div>`).join('')}</div>
       <div class="mon"><h3>Utilization</h3>${c.plans.map(([k, v]) => `<div class="kv"><b>${k}</b><span>${v}</span></div>`).join('')}</div>`;
  return `<aside class="dock"><div class="dhead">Monitors <span>5 of 6</span></div><div class="tabs">${tabs}</div>${body}</aside>`;
}
function settings() {
  const row = (id) => {
    const c = on(id), off = isOff(id);
    return `<div class="crow" style="--c:${c.color}"><span class="g">${ICON[c.glyph]}</span><div class="n">${c.name}<small>${c.sub}</small></div><div class="s"><i class="dot ${off ? 'off' : ''}"></i>${off ? 'Offline 12m' : `${c.route}, ${c.ms}`}</div><div class="s">${c.gpu}</div><div class="s">${c.agents} agents</div><button class="x" title="Rename, change color, forget">${ICON.dots}</button></div>`;
  };
  const nav = ['General', 'Appearance', 'Phone pairing', 'Computers', 'Agents', 'Security', 'Connections', 'About'];
  return `<div class="settings"><nav class="snav">${nav.map((n) => `<span class="${n === 'Computers' ? 'on' : ''}">${n}</span>`).join('')}</nav><div class="scontent"><div class="row" style="justify-content:space-between;max-width:900px"><div><h2>Computers</h2></div><button class="btn pri" data-add>Add a computer</button></div><p>Agents on these computers show up here beside your own. They run there, with that computer's models, subscriptions and files. Nothing else about this Mac is shared with them.</p><div style="max-width:900px">${row('gomi')}${row('studio')}</div><h3>Let a computer connect to this one</h3><p>Make a link here, then paste it into Add a computer on the other computer. Pairing works one way: gomi can't reach this Mac unless you pair in that direction too.</p><button class="btn">Make a link</button></div></div>`;
}
function addModal() {
  if (S.scene !== 'add') return '';
  const steps = [
    `<h2>Add a computer</h2><p>On the other computer, open Settings, Computers, then Make a link, and copy it. Paste it here. The link works once, for 10 minutes.</p><input aria-label="Pairing link" value="nekko-agent-pair:relay=ws%3A%2F%2Fstudio.tailfd6474.ts.net..."><div class="row end"><button class="btn" data-go="settings">Cancel</button><button class="btn pri" data-step="1">Continue</button></div>`,
    `<h2>Connect to Mac Studio?</h2><p>This Mac will see every agent on it, and can start and steer them. You can change or remove this on either computer.</p><div class="confirm"><div class="kv"><span>Name</span><b>Mac Studio</b></div><div class="kv"><span>Reached through</span><b>This network, then Tailscale</b></div><div class="kv"><span>Encrypted</span><b>End to end</b></div></div><div class="row end"><button class="btn" data-step="0">Back</button><button class="btn pri" data-step="2">Connect</button></div>`,
    `<h2>Mac Studio is connected</h2><p>Its 2 agents are in your Agents panel now. It shows up as a paired device on Mac Studio, where you can limit or remove it.</p><div class="confirm"><div class="kv"><span>Reached through</span><b>This network, 2 ms</b></div><div class="kv"><span>Models</span><b>Llama 4 Behemoth 180B, Opus 5.5</b></div></div><div class="row end"><button class="btn pri" data-go="computer">Done</button></div>`,
  ];
  return `<div class="modal"><div class="dialog">${steps[S.addStep]}</div></div>`;
}
function render() {
  const isSettings = S.scene === 'settings' || S.scene === 'add';
  document.getElementById('deck').innerHTML = `<b>Connected computers</b>${SCENES.map(([k, l]) => `<button class="${S.scene === k ? 'on' : ''}" data-go="${k}">${l}</button>`).join('')}<span class="sp"></span><button data-theme-toggle>Light or dark</button>`;
  document.getElementById('note').innerHTML = SCENES.find(([k]) => k === S.scene)[2];
  const rail = `<nav class="rail">${['cat', 'side', 'sliders', 'search'].map((k, i) => `<span class="r ${i === 0 && !isSettings ? 'on' : ''}">${ICON[k]}</span>`).join('')}</nav>`;
  const head = `<header class="title"><span style="color:var(--ink-soft)">${ICON.cat}</span><h1>${isSettings ? 'Settings' : 'Agents'}</h1><span class="sp"></span><span style="color:var(--accent)">${ICON.plus}</span><div class="seg"><span class="on">Focused</span><span>Dynamic</span></div><div class="seg"><span>1/2</span></div></header>`;
  document.getElementById('app').innerHTML = head + rail + (isSettings ? settings() + addModal() : panel() + wall() + dock() + viewMenu());
  fit();
}
function fit() {
  const s = Math.min(1, (window.innerWidth - 32) / 1440);
  const el = document.getElementById('scaler');
  el.style.transform = `scale(${s})`;
  document.getElementById('stage').style.height = `${860 * s + 46}px`;
}
const SCENE_SETUP = {
  activity: { groupBy: 'status', menu: null, sub: null, sel: 'a', offline: false, dock: 'gomi' },
  computer: { groupBy: 'computer', menu: true, sub: 'group', sel: 'a', offline: false, dock: 'gomi' },
  new: { groupBy: 'status', menu: null, sub: null, runOn: 'gomi', picker: true, offline: false, dock: 'gomi' },
  remote: { groupBy: 'status', menu: null, sub: null, sel: 'a', offline: false, dock: 'gomi' },
  offline: { groupBy: 'computer', menu: null, sub: null, sel: 'a', offline: true, dock: 'gomi' },
  settings: { offline: false, menu: null, sub: null },
  add: { offline: false, addStep: 0, menu: null, sub: null },
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) { if (S.menu && !e.target.closest('.menu')) { S.menu = null; S.sub = null; render(); } return; }
  const d = t.dataset;
  if (d.themeToggle !== undefined) { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; return; }
  if (d.go) { S.scene = d.go; Object.assign(S, SCENE_SETUP[d.go]); if (d.on) { S.runOn = d.on; S.picker = false; } if (d.go === 'computer' && d.on === undefined && document.querySelector('.modal')) { S.menu = null; S.sub = null; } }
  else if (d.sel) { S.sel = d.sel; const a = AGENTS.find((x) => x.id === d.sel); S.menu = null; S.sub = null; if (a.on !== 'local') S.dock = a.on; if (S.scene === 'new') S.scene = 'activity'; }
  else if (d.menu !== undefined) { S.menu = !S.menu; S.sub = null; }
  else if (d.sub) S.sub = d.sub;
  else if (d.group) { S.groupBy = d.group; }
  else if (d.toggleChip !== undefined) S.showComputer = !S.showComputer;
  else if (d.dock) S.dock = d.dock;
  else if (d.run) { S.runOn = d.run; }
  else if (d.picker !== undefined) S.picker = !S.picker;
  else if (d.add !== undefined) { S.scene = 'add'; S.addStep = 0; }
  else if (d.step) S.addStep = Number(d.step);
  else return;
  render();
});
window.addEventListener('resize', fit);
render();
</script>
