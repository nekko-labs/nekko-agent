<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Several accounts in one Nekko Agent window</title>
  <desc id="d">One Nekko Agent window lists every account. API keys and ChatGPT plans run on Nekko's engine; each Claude Agent account is the user's own Claude Code, each with its own login folder.</desc>
  <rect width="880" height="470" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="18" fill="none" stroke="#e4e0f0"/>

  <!-- the window -->
  <rect x="250" y="28" width="380" height="96" rx="14" fill="#f1eef9" stroke="#5b4ea7" stroke-width="1.5"/>
  <circle cx="272" cy="46" r="4" fill="#d9d4ea"/><circle cx="286" cy="46" r="4" fill="#d9d4ea"/><circle cx="300" cy="46" r="4" fill="#d9d4ea"/>
  <text x="440" y="74" text-anchor="middle" font-size="19" font-weight="700" fill="#17151f">One Nekko Agent window</text>
  <text x="440" y="99" text-anchor="middle" font-size="13" fill="#5d5970">Every chat picks an account; chats on different accounts run side by side</text>

  <!-- branches -->
  <path d="M440 124 V150 M130 150 H750 M130 150 V178 M330 150 V178 M550 150 V178 M750 150 V178" fill="none" stroke="#9a93bf" stroke-width="1.5"/>

  <!-- Nekko engine group -->
  <rect x="24" y="178" width="412" height="190" rx="14" fill="#fbfaff" stroke="#e4e0f0"/>
  <text x="40" y="203" font-size="12" font-weight="700" fill="#5b4ea7" letter-spacing="0.6">RUNS ON NEKKO'S ENGINE</text>

  <rect x="40" y="216" width="180" height="136" rx="12" fill="#ffffff" stroke="#d9d4ea"/>
  <text x="56" y="242" font-size="14" font-weight="700" fill="#17151f">ChatGPT</text>
  <text x="56" y="262" font-size="12" fill="#5d5970">me@home.example</text>
  <rect x="56" y="276" width="148" height="24" rx="12" fill="#eef7f1"/>
  <text x="130" y="292" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f7a4b">Plus plan, signed in</text>
  <text x="56" y="322" font-size="11.5" fill="#5d5970">Own token, own</text>
  <text x="56" y="338" font-size="11.5" fill="#5d5970">usage limits</text>

  <rect x="240" y="216" width="180" height="136" rx="12" fill="#ffffff" stroke="#d9d4ea"/>
  <text x="256" y="242" font-size="14" font-weight="700" fill="#17151f">Claude (API key)</text>
  <text x="256" y="262" font-size="12" fill="#5d5970">Work Console key</text>
  <rect x="256" y="276" width="148" height="24" rx="12" fill="#eef7f1"/>
  <text x="330" y="292" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2f7a4b">Billed per token</text>
  <text x="256" y="322" font-size="11.5" fill="#5d5970">Add as many keys</text>
  <text x="256" y="338" font-size="11.5" fill="#5d5970">as you have</text>

  <!-- Claude Code group -->
  <rect x="444" y="178" width="412" height="190" rx="14" fill="#fbfaff" stroke="#e4e0f0"/>
  <text x="460" y="203" font-size="12" font-weight="700" fill="#5b4ea7" letter-spacing="0.6">RUNS YOUR OWN CLAUDE CODE</text>

  <rect x="460" y="216" width="180" height="136" rx="12" fill="#ffffff" stroke="#d9d4ea"/>
  <text x="476" y="242" font-size="14" font-weight="700" fill="#17151f">Claude Agent</text>
  <text x="476" y="262" font-size="12" fill="#5d5970">Your usual login</text>
  <rect x="476" y="276" width="148" height="24" rx="6" fill="#f1eef9"/>
  <text x="550" y="292" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#453a92">~/.claude</text>
  <text x="476" y="322" font-size="11.5" fill="#5d5970">Signed in with</text>
  <text x="476" y="338" font-size="11.5" fill="#5d5970">Claude Code's /login</text>

  <rect x="660" y="216" width="180" height="136" rx="12" fill="#ffffff" stroke="#d9d4ea"/>
  <text x="676" y="242" font-size="14" font-weight="700" fill="#17151f">Claude Agent · Work</text>
  <text x="676" y="262" font-size="12" fill="#5d5970">Second account</text>
  <rect x="676" y="276" width="148" height="24" rx="6" fill="#f1eef9"/>
  <text x="750" y="292" text-anchor="middle" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#453a92">~/.claude-work</text>
  <text x="676" y="322" font-size="11.5" fill="#5d5970">Its own /login, its</text>
  <text x="676" y="338" font-size="11.5" fill="#5d5970">own sessions</text>

  <!-- footer -->
  <rect x="24" y="388" width="832" height="58" rx="12" fill="#f1eef9"/>
  <text x="440" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="#2b2838">Each account keeps its own sign-in. Nekko never sees a Claude login:</text>
  <text x="440" y="432" text-anchor="middle" font-size="13" fill="#2b2838">Claude Code stores it in the account's folder, and Nekko only asks <tspan font-family="ui-monospace, Menlo, Consolas, monospace">claude auth status</tspan>.</text>
</svg>
