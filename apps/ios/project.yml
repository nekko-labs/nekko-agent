name: NekkoNative
options:
  minimumXcodeGenVersion: 2.38.0
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
packages:
  NekkoProtocol:
    path: Protocol
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NekkoNative:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nekkolabs.nekkoagent
        PRODUCT_NAME: NekkoNative
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NekkoNative.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: NekkoProtocol
        product: NekkoProtocol
      - package: NekkoProtocol
        product: NekkoKit
      - target: NekkoWidgets
        embed: true
      - target: NekkoShare
        embed: true
      - target: NekkoWatch
        embed: true
  NekkoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
        excludes: ["*.entitlements"]
      - path: App/Shared/StatusSnapshot.swift
      - path: App/Shared/WatchStatus.swift
    dependencies:
      - target: NekkoWatchWidgets
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Watch/NekkoWatch.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.nekkolabs.nekkoagent.watchkitapp
        PRODUCT_NAME: NekkoWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nekko Agent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: dev.nekkolabs.nekkoagent
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  NekkoWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: App/Shared/StatusSnapshot.swift
      - path: App/Shared/WatchStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nekkolabs.nekkoagent.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/NekkoWatchWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  NekkoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nekkolabs.nekkoagent.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/NekkoWidgets.entitlements
  NekkoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nekkolabs.nekkoagent.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Share/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Share/NekkoShare.entitlements
    dependencies:
      - package: NekkoProtocol
        product: NekkoProtocol
  NekkoNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NekkoNative
  NekkoNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NekkoNative
schemes:
  NekkoNative:
    build:
      targets:
        NekkoNative: all
    test:
      targets:
        - NekkoNativeTests
        - NekkoNativeUITests
