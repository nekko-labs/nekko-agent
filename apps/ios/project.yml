name: NekkoNative
options:
  minimumXcodeGenVersion: 2.38.0
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.0"
packages:
  NekkoProtocol:
    path: Protocol
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NekkoNative:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekko.native.ios
        PRODUCT_NAME: NekkoNative
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: App/NekkoNative.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: NekkoProtocol
        product: NekkoProtocol
      - package: NekkoProtocol
        product: NekkoKit
      - target: NekkoWidgets
        embed: true
  NekkoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist"]
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekko.native.ios.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
  NekkoNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NekkoNative
  NekkoNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NekkoNative
schemes:
  NekkoNative:
    build:
      targets:
        NekkoNative: all
    test:
      targets:
        - NekkoNativeTests
        - NekkoNativeUITests
