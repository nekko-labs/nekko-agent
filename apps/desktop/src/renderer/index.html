<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      'wasm-unsafe-eval' and data: in connect-src are for the terminal: ghostty-web
      compiles Ghostty's terminal core from an inlined data: URL. Neither allows
      running script text; wasm-unsafe-eval covers WebAssembly compilation only.
      frame-src is for the Browser pane in the Local Web UI, which has no
      <webview> and shows the page in a sandboxed iframe instead.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' ws: wss: data:; frame-src 'self' http: https:; manifest-src 'self'; worker-src 'self'"
    />
    <!-- Until the theme is applied (store.applyTheme then follows the app's own paper). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <title>Nekko Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
