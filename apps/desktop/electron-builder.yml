appId: dev.nekkolabs.nekkoagent
productName: Nekko Agent
# electron-builder 26 derives this from the npm package name (@nekko-agent/desktop
# → "@nekko-agentdesktop") and then rejects the @ as unsafe, so pin it. Spelled
# without the space in "Nekko Agent" on purpose: this is the on-disk binary
# name, and artifactName below matches it so download URLs need no escaping.
executableName: NekkoAgent
copyright: Copyright © 2026 Nekko Labs
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
icon: build/icon
files:
  - out/**/*
  - package.json
# @lydell/node-pty ships a native .node binary that must live outside the asar
# archive so it can be dlopen'd at runtime (and its prebuilt platform package).
# The nekko-agent CLI, bundled as one CommonJS file (apps/cli/scripts/bundle-app.mjs)
# and run by this app's own Electron binary, so installing the app installs the
# CLI with no Node or npm. main/cli-install.ts links it onto PATH on first run.
extraResources:
  - from: resources/agent-browser
    to: agent-browser
  - from: ../cli/app-dist/nekko-agent-cli.cjs
    to: cli/nekko-agent-cli.cjs
  # The engine daemon (crates/nekkod), built and staged by scripts/stage-daemon.mjs.
  # main/engine-process.ts starts it from <resources>/bin.
  - from: resources/bin
    to: bin
asarUnpack:
  - "**/node_modules/@lydell/node-pty/**"
  - "**/node_modules/@lydell/node-pty-*/**"
extraMetadata:
  main: out/main/index.js
# macOS resolves URL schemes from Info.plist, so setAsDefaultProtocolClient in
# main is not enough for a packaged build.
protocols:
  - name: Nekko Agent
    schemes:
      - nekko-agent
publish:
  provider: github
  owner: nekko-labs
  repo: nekko-agent
win:
  target:
    - nsis
  artifactName: NekkoAgent-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Add/Remove Programs + Start Menu uninstall entry, with a Start Menu folder.
  menuCategory: true
  createStartMenuShortcut: true
  uninstallDisplayName: Nekko Agent
  # Custom uninstall hook lives at build/installer.nsh, electron-builder picks
  # it up automatically (its customUnInstall macro offers to remove user data).
msi:
  oneClick: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # The .app is what people see in Finder, Launchpad and the DMG's drag
  # window, so it carries the real name with its space, as Mac apps do. The
  # download files keep the spaceless name (artifactName). An install from
  # before this keeps its NekkoAgent.app path on update: the updater installs
  # the new bundle at the installed path, whatever the zip names it.
  executableName: Nekko Agent
  artifactName: NekkoAgent-${version}-${arch}.${ext}
  # Developer ID signing + notarization. electron-builder signs when CSC_LINK
  # and CSC_KEY_PASSWORD are in the environment, and skips signing entirely
  # when they are not — in which case the afterPack hook ad-hoc signs instead
  # so the build still launches locally. Release CI sets them from the
  # nekko-labs org secrets; see docs/signing.md.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Left off here on purpose: notarization needs the App Store Connect key,
  # which only the release workflow has. It turns this on with
  # `-c.mac.notarize=true` rather than failing every local `npm run dist`.
  notarize: false
  gatekeeperAssess: false
  extendInfo:
    # Required for the QR pairing scanner (QrScanner.tsx → getUserMedia).
    # Without it macOS kills the process instead of prompting.
    NSCameraUsageDescription: Nekko Agent uses the camera to scan the pairing QR code shown by the Nekko Agent mobile app.
linux:
  target:
    - AppImage
    - deb
  category: Development
  syncDesktopName: true
  artifactName: NekkoAgent-${version}-${arch}.${ext}
deb:
  # Replace this GitHub noreply fallback when the project publishes a mailbox.
  maintainer: Nekko Labs <nekko-labs@users.noreply.github.com>
  synopsis: Local-first AI coding and cowork assistant
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
