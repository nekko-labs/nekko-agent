# Fly.io config for the Nekko Agent API (beta signups).
# Deploy from apps/nekko-agent-api:
#   fly apps create nekko-agent-api --org <org>          (first time)
#   fly secrets set DATABASE_URL='<Neon pooled connection string>'
#   fly deploy --ha=false
#
# Fly has no spending cap, so the cost ceiling is set here: one small machine,
# no autoscaling, no volume, no dedicated IPv4. About $2/month plus bandwidth.
# It stays on: the cloud machines' hours, over-plan stop and 7-day delete run
# on timers inside this process.
# Nekko Cloud machines also need: fly secrets set FLY_API_TOKEN=<deploy token
# for nekko-cloud-machines> NEKKO_MACHINE_IMAGE=registry.fly.io/nekko-cloud-machines@sha256:<digest>

app = "nekko-agent-api"
primary_region = "iad"   # next to Neon's aws-us-east-1

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://nekkoagent.com,https://www.nekkoagent.com"
  FLY_MACHINES_APP = "nekko-cloud-machines"
  NEKKO_RELAY_URL = "wss://nekko-agent-relay.fly.dev"
  PUBLIC_URL = "https://nekko-agent-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Never stopped: the machine sweeps above only run while this process does.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
