<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>App language · Nekko Agent</title>
<style>
  :root{color-scheme:dark;--paper:#0b0c14;--surface:#1d1f2c;--line:#252735;--ink:#f2edf2;--soft:#b7b5c1;--accent:#dc9ad2}
  *{box-sizing:border-box}body{margin:0;padding:40px;background:var(--paper);color:var(--ink);font:14px system-ui}main{display:flex;flex-wrap:wrap;gap:20px}article{width:360px}h1{font-size:20px;margin:0 0 24px}h2{font-size:14px;color:var(--soft);margin:0 0 8px}.frame{min-height:420px;border:1px solid var(--line);padding:20px}.name{text-align:center;padding-top:102px}.title{font-size:20px;font-weight:600}.hint{color:var(--soft);margin:8px 0 20px}.field{margin:0 auto 20px;padding:12px;background:var(--surface);border-radius:8px}.control{display:inline-flex;align-items:center;gap:8px;background:var(--surface);padding:6px 12px;border-radius:8px;color:var(--ink);white-space:nowrap}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.menu{margin:8px 0 0 auto;width:224px;padding:8px;background:var(--surface);border-radius:10px;box-shadow:0 12px 32px #0007}.option{display:flex;gap:8px;height:32px;align-items:center;padding:0 8px}.badge{width:24px;text-align:center;font:11px ui-monospace,monospace;color:var(--soft)}.picked,.check{color:var(--accent)}.check{margin-left:auto}svg{width:16px;height:16px;vertical-align:middle}
</style>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><symbol id="globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></g></symbol></svg>
<h1>App language</h1><main>
<article><h2>Onboarding · name</h2><div class="frame name"><div class="title">What should I call you?</div><p class="hint">Your name, a nickname, anything you like.</p><div class="field">Your name</div><span class="control"><svg><use href="#globe"/></svg>System default ▾</span></div></article>
<article><h2>Settings · General</h2><div class="frame"><div class="title">Language and help</div><div class="row"><p>Language</p><span class="control"><svg><use href="#globe"/></svg><span lang="ja">日本語</span> ▾</span></div><div class="menu"><div class="option"><span class="badge"><svg><use href="#globe"/></svg></span>System default</div><div class="option"><span class="badge">EN</span>English</div><div class="option" lang="es"><span class="badge">ES</span>Español</div><div class="option" lang="fr"><span class="badge">FR</span>Français</div><div class="option" lang="de"><span class="badge">DE</span>Deutsch</div><div class="option" lang="pt"><span class="badge">PT</span>Português</div><div class="option picked" lang="ja"><span class="badge">あ</span>日本語 <span class="check">✓</span></div><div class="option" lang="zh"><span class="badge">中</span>简体中文</div></div></div></article>
</main></html>
