<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI runner panel design</title>
<style>
body{margin:0;background:#0b0c12;color:#eaeaf4;font-family:Inter,system-ui,sans-serif}
main{padding:32px 16px;display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
header{padding:32px 16px 0} header h1{margin:0;font-size:20px} header p{margin:6px 0 0;color:#a3a4b6;font-size:13px;max-width:640px}
.frame{margin:0;display:flex;flex-direction:column;gap:10px}
figcaption{display:flex;flex-direction:column;gap:2px;font-size:12px;max-width:320px} figcaption span{color:#87899b}
.frame > div{border-radius:12px;outline:1px solid #252735}
a{color:#c084b5;text-decoration:none}
</style>
</head>
<body>
<header><h1>Automations panel: CI runners</h1><p>One line per runner, then only what is happening now. Idle VMs are a count; queued jobs keep their actions; completed jobs wait behind one row. Everything else stays on the CI runners page.</p></header>
<main>
<figure class="frame"><figcaption><b>Busy: one job running, one queued</b><span>Running-job actions show on hover (highlighted row). Queued jobs always show Start now and Skip.</span></figcaption><div style="width: 320px; height: 320px; box-sizing: border-box; background: #14151f; color: #eaeaf4; font-family: Inter, system-ui, sans-serif; font-size: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <h3 style="margin: 0; font-size: 13px; font-weight: 600">CI runners</h3>
    <a href="#" style="font-size: 12px; color: #a3a4b6">Open</a>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #4ec98a; flex-shrink: 0"></span>
    <span style="font-weight: 600; font-size: 13px">nekko-labs</span>
    <span style="color: #a3a4b6; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">1 running · 1 idle</span>
    <button aria-label="Runner settings for nekko-labs" style="width: 24px; height: 24px; border: 0; border-radius: 6px; background: #1d1f2c; color: #a3a4b6; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
    <button role="switch" aria-checked="true" aria-label="Runner on for nekko-labs" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #c084b5; padding: 2px; display: flex; justify-content: flex-end">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; display: block"></span>
    </button>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 0 0 15px; display: flex; flex-direction: column; gap: 2px">
    <li style="padding: 5px 8px; margin: 0 -8px; border-radius: 6px; background: #1d1f2c">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #4ec98a; box-shadow: 0 0 0 3px rgba(78,201,138,0.2); flex-shrink: 0"></span>
        <a href="#" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Native iOS · Build and test</a>
        <span style="color: #87899b; font-variant-numeric: tabular-nums">6 min</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-left: 14px">
        <div style="flex: 1; height: 3px; border-radius: 2px; background: #252735; overflow: hidden"><div style="width: 38%; height: 100%; background: #4ec98a"></div></div>
        <span style="color: #87899b; font-variant-numeric: tabular-nums">4/8</span>
      </div>
      <div style="display: flex; gap: 2px; margin-top: 4px; padding-left: 10px">
        <button style="border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 2px 4px; border-radius: 4px">Live log</button>
        <button style="border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 2px 4px; border-radius: 4px">Re-run</button>
        <button style="border: 0; background: transparent; color: #ef6a5d; font: inherit; padding: 2px 4px; border-radius: 4px">Cancel</button>
      </div>
    </li>
    <li style="padding: 5px 0; display: flex; align-items: center; gap: 8px">
      <span style="width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid #87899b; box-sizing: border-box; flex-shrink: 0"></span>
      <a href="#" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #eaeaf4">Native iOS · Next build</a>
      <span style="color: #87899b">2 min</span>
      <button style="border: 0; background: transparent; color: #c084b5; font: inherit; padding: 2px 4px; border-radius: 4px">Start now</button>
      <button style="border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 2px 4px; border-radius: 4px">Skip</button>
    </li>
    <li style="padding: 5px 0; display: flex; align-items: center; gap: 8px">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #6bb8d4; flex-shrink: 0"></span>
      <span style="flex: 1; min-width: 0; color: #a3a4b6">Starting a VM</span>
      <span style="color: #87899b; font-variant-numeric: tabular-nums">0:24</span>
    </li>
  </ul>

  <button aria-expanded="false" style="display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 5px 0 5px 15px; text-align: left">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    <span>Completed · 3 jobs</span>
  </button>
</div></figure>
<figure class="frame"><figcaption><b>Completed opened: one job inspected</b><span>Completed · N jobs opens the finished jobs; each opens to steps, job log and VM log.</span></figcaption><div style="width: 320px; height: 420px; box-sizing: border-box; background: #14151f; color: #eaeaf4; font-family: Inter, system-ui, sans-serif; font-size: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #4ec98a; flex-shrink: 0"></span>
    <span style="font-weight: 600; font-size: 13px">nekko-labs</span>
    <span style="color: #a3a4b6; flex: 1">Ready · 2 idle</span>
    <button role="switch" aria-checked="true" aria-label="Runner on for nekko-labs" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #c084b5; padding: 2px; display: flex; justify-content: flex-end">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; display: block"></span>
    </button>
  </div>

  <button aria-expanded="true" style="display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #eaeaf4; font: inherit; padding: 5px 0 5px 15px; text-align: left">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    <span>Completed · 3 jobs</span>
  </button>

  <ul style="list-style: none; margin: 0; padding: 0 0 0 15px; display: flex; flex-direction: column; gap: 2px">
    <li>
      <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #4ec98a; flex-shrink: 0"></span>
        <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Native iOS · Build and test</span>
        <span style="color: #87899b; font-variant-numeric: tabular-nums">14:02</span>
        <a href="#">PR #904</a>
      </div>
      <div style="margin: 2px 0 6px 14px; display: flex; flex-direction: column; gap: 6px">
        <ol style="margin: 0; padding: 0; list-style: none; color: #a3a4b6; display: flex; flex-direction: column; gap: 2px">
          <li><code style="font-family: ui-monospace, monospace; font-size: 10px; color: #87899b">13:23:10</code> VM started</li>
          <li><code style="font-family: ui-monospace, monospace; font-size: 10px; color: #87899b">13:23:41</code> Job picked up</li>
          <li><code style="font-family: ui-monospace, monospace; font-size: 10px; color: #87899b">14:02:05</code> Finished, VM deleted</li>
        </ol>
        <div style="display: flex; gap: 2px">
          <button style="border: 0; background: #1d1f2c; color: #eaeaf4; font: inherit; padding: 3px 8px; border-radius: 5px">Job log</button>
          <button style="border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 3px 8px; border-radius: 5px">VM log</button>
          <button style="border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 3px 8px; border-radius: 5px">Re-run</button>
        </div>
        <pre style="margin: 0; padding: 8px; border-radius: 6px; background: #1d1f2c; color: #a3a4b6; font-family: ui-monospace, monospace; font-size: 10px; white-space: pre-wrap; max-height: 70px; overflow: hidden">** TEST SUCCEEDED **
Executed 412 tests, with 0 failures in 381.2s
Cleaning up orphan processes</pre>
      </div>
    </li>
    <li style="display: flex; align-items: center; gap: 8px; padding: 4px 0">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #4ec98a; flex-shrink: 0"></span>
      <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Desktop · Unit tests</span>
      <span style="color: #87899b; font-variant-numeric: tabular-nums">13:10</span>
    </li>
    <li style="display: flex; align-items: center; gap: 8px; padding: 4px 0">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #e0a44a; flex-shrink: 0"></span>
      <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ci · darwin daemon · stopped after 2 min</span>
      <span style="color: #87899b; font-variant-numeric: tabular-nums">12:41</span>
    </li>
  </ul>
</div></figure>
<figure class="frame"><figcaption><b>Idle: nothing to do</b><span>Nothing running, nothing wrong: one line per runner, no rows.</span></figcaption><div style="width: 320px; height: 300px; box-sizing: border-box; background: #14151f; color: #eaeaf4; font-family: Inter, system-ui, sans-serif; font-size: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <h3 style="margin: 0; font-size: 13px; font-weight: 600">CI runners</h3>
    <a href="#" style="font-size: 12px">Open</a>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #4ec98a; flex-shrink: 0"></span>
    <span style="font-weight: 600; font-size: 13px">nekko-labs</span>
    <span style="color: #a3a4b6; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ready · 2 idle</span>
    <button role="switch" aria-checked="true" aria-label="Runner on for nekko-labs" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #c084b5; padding: 2px; display: flex; justify-content: flex-end">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; display: block"></span>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: #87899b; flex-shrink: 0"></span>
    <span style="font-weight: 600; font-size: 13px; color: #a3a4b6">example/app</span>
    <span style="color: #87899b; flex: 1">Off</span>
    <button role="switch" aria-checked="false" aria-label="Runner on for example/app" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #252735; padding: 2px; display: flex; justify-content: flex-start">
      <span style="width: 14px; height: 14px; border-radius: 50%; background: #a3a4b6; display: block"></span>
    </button>
  </div>

  
</div></figure>
<figure class="frame"><figcaption><b>Needs you: waiting, setup, error</b><span>A runner error ends with a link to its settings.</span></figcaption><div style="width: 320px; height: 300px; box-sizing: border-box; background: #14151f; color: #eaeaf4; font-family: Inter, system-ui, sans-serif; font-size: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <h3 style="margin: 0; font-size: 13px; font-weight: 600">CI runners</h3>
    <a href="#" style="font-size: 12px">Open</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #e0a44a; flex-shrink: 0"></span>
      <span style="font-weight: 600; font-size: 13px">nekko-labs</span>
      <span style="color: #a3a4b6; flex: 1">Waiting</span>
      <button role="switch" aria-checked="true" aria-label="Runner on for nekko-labs" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #c084b5; padding: 2px; display: flex; justify-content: flex-end">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; display: block"></span>
      </button>
    </div>
    <p style="margin: 0; padding-left: 15px; color: #a3a4b6">On battery. Plug in or choose Runner first to take jobs.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #e0a44a; flex-shrink: 0"></span>
      <span style="font-weight: 600; font-size: 13px">example/app</span>
      <span style="color: #a3a4b6; flex: 1">Setting up</span>
      <button role="switch" aria-checked="true" aria-label="Runner on for example/app" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #c084b5; padding: 2px; display: flex; justify-content: flex-end">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; display: block"></span>
      </button>
    </div>
    <div style="padding-left: 15px; display: flex; align-items: center; gap: 8px">
      <span style="flex: 1; min-width: 0; color: #a3a4b6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Downloading macOS · 41%</span>
      <button style="border: 0; background: transparent; color: #a3a4b6; font: inherit; padding: 2px 4px">Details</button>
    </div>
    <div style="margin-left: 15px; height: 3px; border-radius: 2px; background: #252735; overflow: hidden"><div style="width: 41%; height: 100%; background: #4ec98a"></div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 28px">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #ef6a5d; flex-shrink: 0"></span>
      <span style="font-weight: 600; font-size: 13px">acme/site</span>
      <span style="color: #ef6a5d; flex: 1">Error</span>
      <button role="switch" aria-checked="true" aria-label="Runner on for acme/site" style="width: 30px; height: 18px; border: 0; border-radius: 9px; background: #c084b5; padding: 2px; display: flex; justify-content: flex-end">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #ffffff; display: block"></span>
      </button>
    </div>
    <p role="alert" style="margin: 0; padding-left: 15px; color: #ef6a5d">GitHub token expired. Reconnect <a href="#" style="color: #ef6a5d; text-decoration: underline">here</a>.</p>
  </div>
</div></figure>
</main>
</body>
</html>
