<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Engines · pick what runs local models</title>
<style>
:root{font:14px/1.4 Geist,system-ui,sans-serif;color:#2e2330;background:#f3edf3;--paper:#fcf8fb;--line:#e5d7e3;--ink:#2e2330;--soft:#6e5d6f;--faint:#9a8a9b;--accent:#773460;--wash:#f4eaf2;--info:#1f6680;--success:#2f7d57;--danger:#a23a3a}
*{box-sizing:border-box}body{margin:24px}h1{font-size:22px;margin:0 0 4px}.lede{color:var(--soft);margin:0 0 24px;max-width:860px}
.canvas{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
figure{margin:0;width:620px}figure.narrow{width:390px}figure.wide{width:760px}
figcaption{font-size:12px;font-weight:600;color:var(--soft);margin:0 0 8px}
figcaption small{display:block;font-weight:400;color:var(--faint);margin-top:2px}
article{background:var(--paper);border-radius:14px;padding:20px;box-shadow:0 1px 0 var(--line)}
.fold{border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.fold+.fold{margin-top:12px}
.sum{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.sum .chev{width:14px;color:var(--faint);font-size:11px}
.sum .inuse{margin-left:auto;font-size:12px;font-weight:400;color:var(--faint)}
.group{font-size:12px;font-weight:500;color:var(--soft);margin:20px 0 8px}
.group:first-of-type{margin-top:12px}
.help{font-size:12px;color:var(--faint);margin:4px 0 0}
.row{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px;margin:0 -8px;border-radius:8px}
.row:hover{background:var(--wash)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:500}
.row .detail{font-size:12px;color:var(--faint);margin-top:4px}
.row.on .name{color:var(--accent)}
.row.off .name{color:var(--faint)}
.row.off:hover{background:none}
.tag{margin-left:8px;font-size:12px;font-weight:400;color:var(--info)}
.use{margin-left:8px;font-size:12px;font-weight:400;color:var(--soft)}
.use::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--success);margin-right:6px}
.meta{font:12px "Geist Mono",ui-monospace,monospace;color:var(--faint)}
button{font:500 12px inherit;height:28px;padding:0 12px;border:0;border-radius:8px;background:var(--wash);color:var(--ink)}
button.primary{background:var(--accent);color:#fff}
button.quiet{background:none;color:var(--faint)}
button.danger{background:none;color:var(--danger)}
.bar{height:4px;border-radius:2px;background:var(--line);width:120px;overflow:hidden}.bar i{display:block;height:100%;width:42%;background:var(--accent)}
.page h2{font-size:16px;margin:0 0 12px}.page .muted{color:var(--faint);font-size:12px}
.note{font-size:12px;color:var(--soft);margin:10px 2px 0;max-width:620px}
.drawer h3{font-size:14px;margin:0 0 4px}.drawer .line{display:flex;align-items:center;gap:12px;min-height:40px}
.drawer .line .main{flex:1}.switch{width:36px;height:20px;border-radius:10px;background:var(--accent);position:relative}.switch::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.switch.offs{background:var(--line)}.switch.offs::after{right:auto;left:2px}
table{border-collapse:collapse;font-size:12px;width:100%}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--soft);font-weight:500;border-top:0}
</style>
<h1>Engines · pick what runs local models</h1>
<p class="lede">A folded block above System models. Each kind of model has its engines listed, one in use. An engine this machine cannot run stays in the list with the reason. With no choice made, the fastest one is in use.</p>
<div class="canvas">

<figure><figcaption>01 / Folded, the default<small>One line above System models. Says which engine is in use without opening.</small></figcaption><article class="page">
<h2>Local model server</h2>
<div class="fold"><div class="sum"><span class="chev">▸</span>Engines<span class="inuse">llama.cpp in use</span></div></div>
<div class="fold"><div class="sum"><span class="chev">▸</span>System models</div></div>
<p class="muted" style="margin-top:20px">● Model server &nbsp; http://127.0.0.1:11500/v1 &emsp; Models · On this machine 12 · Find new models</p>
</article></figure>

<figure><figcaption>02 / Open on an Apple Silicon Mac<small>Fastest and Most stable are worked out among what this machine can run.</small></figcaption><article>
<div class="fold"><div class="sum"><span class="chev">▾</span>Engines</div>
<p class="help">What runs your models. Nekko loads a model on the engine in use whenever that engine can run it.</p>
<div class="group">Chat models</div>
<div class="row on"><div class="main"><div class="name">llama.cpp<span class="tag">Fastest</span><span class="use">In use</span></div><div class="detail">Runs any GGUF model, on every computer.</div></div><span class="meta">b12532</span></div>
<div class="row"><div class="main"><div class="name">oMLX</div><div class="detail">MLX with batching and a prompt cache kept on disk.</div></div><span class="meta">0.8.3 · 420 MB</span><button>Install</button></div>
<div class="row"><div class="main"><div class="name">MLX<span class="tag">Most stable</span></div><div class="detail">Apple's own framework. Runs MLX models.</div></div><span class="meta">mlx-lm 0.31.3</span><button>Use</button></div>
<div class="row off"><div class="main"><div class="name">Basalt</div><div class="detail">NVIDIA RTX 50 series only</div></div></div>
<div class="row off"><div class="main"><div class="name">squid5090</div><div class="detail">NVIDIA RTX 5090 only</div></div></div>
<div class="group">Photo and video models</div>
<div class="row on"><div class="main"><div class="name">stable-diffusion.cpp<span class="use">In use</span></div><div class="detail">Runs SD3.5, FLUX and other image models.</div></div><span class="meta">master-1086</span><button class="danger">Uninstall</button></div>
</div>
</article><p class="note">llama.cpp is Fastest on a Mac because Nekko runs it with speculative decoding: measured 4.6x ahead of mlx-lm on a code edit (docs/benchmarks.md). An MLX model still runs on MLX while llama.cpp is in use.</p></figure>

<figure><figcaption>03 / Linux with an RTX 5090<small>squid5090 is the fastest; llama.cpp the most stable. Mac engines stay, disabled.</small></figcaption><article>
<div class="fold"><div class="sum"><span class="chev">▾</span>Engines</div>
<div class="group">Chat models</div>
<div class="row"><div class="main"><div class="name">squid5090<span class="tag">Fastest</span></div><div class="detail">Built for one RTX 5090. Runs Inkling 2 Mini.</div></div><button>Set up</button></div>
<div class="row on"><div class="main"><div class="name">Basalt<span class="use">In use</span></div><div class="detail">Built for RTX 50 series cards. Runs its own model packs.</div></div><span class="meta">0.5.7</span><button class="danger">Uninstall</button></div>
<div class="row"><div class="main"><div class="name">llama.cpp<span class="tag">Most stable</span></div><div class="detail">Runs any GGUF model, on every computer.</div></div><span class="meta">b12532</span><button>Use</button></div>
<div class="row off"><div class="main"><div class="name">MLX</div><div class="detail">macOS only</div></div></div>
<div class="row off"><div class="main"><div class="name">oMLX</div><div class="detail">macOS only</div></div></div>
</div>
</article><p class="note">squid5090 publishes no downloads, so Nekko cannot install it by itself. Set up points Nekko at one you built. Until then the fastest engine Nekko can install is in use.</p></figure>

<figure><figcaption>04 / Windows with an RTX 5090<small>Same card, different reason: squid5090 is Linux only.</small></figcaption><article>
<div class="fold"><div class="sum"><span class="chev">▾</span>Engines</div>
<div class="group">Chat models</div>
<div class="row"><div class="main"><div class="name">Basalt<span class="tag">Fastest</span></div><div class="detail">Built for RTX 50 series cards. Runs its own model packs.</div></div><span class="meta">0.5.7 · 410 MB</span><button class="primary">Install</button></div>
<div class="row on"><div class="main"><div class="name">llama.cpp<span class="tag">Most stable</span><span class="use">In use</span></div><div class="detail">Runs any GGUF model, on every computer.</div></div><span class="meta">b12532</span></div>
<div class="row off"><div class="main"><div class="name">squid5090</div><div class="detail">Linux only</div></div></div>
<div class="row off"><div class="main"><div class="name">MLX</div><div class="detail">macOS only</div></div></div>
<div class="row off"><div class="main"><div class="name">oMLX</div><div class="detail">macOS only</div></div></div>
</div>
</article><p class="note">Install is the one primary button: it is on the fastest engine this machine can run and does not have yet. With no choice made, it takes over once it is installed; a choice already made stays, and the new engine offers Use.</p></figure>

<figure><figcaption>05 / A PC with no RTX 50 series card<small>One usable engine, so no Fastest or Most stable: there is nothing to compare.</small></figcaption><article>

<div class="row off"><div class="main"><div class="name">oMLX</div><div class="detail">macOS only</div></div></div>
