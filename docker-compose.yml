# Nekko Agent, self-hosted Local Web UI in Docker.
#   docker compose up        (build + run)
# Then open http://localhost:1440
services:
  nekko-agent:
    build: .
    # Or use a published image instead of building:
    # image: ghcr.io/nekko-labs/nekko-agent:latest
    # Published to the host's localhost only. To expose on your LAN, change to
    # "1440:1440" AND set NEKKO_TOKEN below (or read the generated token from
    # `docker compose logs`).
    ports:
      - "127.0.0.1:1440:1440"
    volumes:
      # Codebases the agent may read/edit (workspace-jail sandbox confines it here).
      - ./workspace:/workspace
      # Settings, sessions, memory, usage.
      - nekko-agent-data:/data
    environment:
      - NEKKO_SANDBOX=workspace-jail
    # Lets the container reach a model server (Ollama/LM Studio/vLLM) on the host,
    # e.g. base URL http://host.docker.internal:1234
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  nekko-agent-data: {}
