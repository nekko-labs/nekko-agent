[package]
name = "nekko-sandbox"
description = "The Nekko Agent container sandbox for the engine daemon: a sandbox chat's tools run in a locked-down Docker container over a private copy of its folders, exactly as the TS host ran them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
getrandom.workspace = true
nekko-js = { path = "../nekko-js" }
nekko-settings = { path = "../nekko-settings" }
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
