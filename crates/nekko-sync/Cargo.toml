[package]
name = "nekko-sync"
description = "End-to-end encrypted chat sync with Nekko Cloud (Pro and Team): the account key hierarchy, record sealing, key wrapping to devices and the recovery key, and anonymous sealed donations. Nekko Cloud only ever stores the ciphertext this crate makes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
base64.workspace = true
getrandom.workspace = true
hkdf = "0.12"
hmac = "0.12"
# P-256 rather than X25519: the iPhone keeps device keys in the Secure Enclave
# (P-256 only), and Android before API 31 has no X25519.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
