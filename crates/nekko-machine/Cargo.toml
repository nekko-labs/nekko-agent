[package]
name = "nekko-machine"
description = "Machine probes for the Nekko Agent engine daemon: GPU and system stats and the offline-stack readiness advisor, as the TS host computes them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nekko-js = { path = "../nekko-js" }
regress.workspace = true
# Catalog sizes like 6.3 GiB (6764573491.2) must parse to the exact double JavaScript has.
serde_json = { workspace = true, features = ["float_roundtrip"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Performance"] }

# macOS temperature sensors (IOKit HID). Only there: on Windows sysinfo's
# component support is WMI with process-wide COM security, which the daemon
# does not want; Linux reads hwmon directly.
[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "component"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
