[package]
name = "nekko-automation"
description = "Automation for the Nekko Agent engine daemon: tasks and workflows (scheduled, recurring, background, triggered), as the TS host ran them, with the same files."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
getrandom.workspace = true
nekko-connectors = { path = "../nekko-connectors" }
nekko-js = { path = "../nekko-js" }
# Numbers must parse to the exact double JavaScript has, or a rewritten file differs.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio.workspace = true

[dev-dependencies]
chrono-tz = "0.10"
