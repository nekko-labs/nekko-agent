[package]
name = "nekkod"
description = "The Nekko Agent engine daemon: one loopback wire for the UI, native services, and a supervised TS host for everything not ported yet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Linux: run decision models on CUDA (pulls the several-hundred-MB CUDA build of ONNX Runtime).
cuda = ["nekko-decide/cuda"]
# Developer-only settings (`npm run dev`'s daemon, stage-daemon.mjs): the Claude
# policy preview. Never on in the release build the app packages.
dev-tools = []

[dependencies]
# Verifies the signed claudePolicy document (claude_policy.rs).
ed25519-dalek = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
bytes.workspace = true
futures-util.workspace = true
# The computer's name and addresses, for "Visible on this network" and the local relay.
gethostname = "1"
nekko-cloud = { path = "../nekko-cloud" }
if-addrs = "0.13"
getrandom.workspace = true
icu_normalizer = "2"
nekko-agent = { path = "../nekko-agent" }
nekko-automation = { path = "../nekko-automation" }
nekko-chat = { path = "../nekko-chat" }
nekko-codemode = { path = "../nekko-codemode" }
nekko-privacy = { path = "../nekko-privacy" }
nekko-connectors = { path = "../nekko-connectors" }
nekko-context = { path = "../nekko-context" }
nekko-decide = { path = "../nekko-decide" }
nekko-engine = { path = "../nekko-engine" }
nekko-harness = { path = "../nekko-harness" }
nekko-infer = { path = "../nekko-infer" }
nekko-js = { path = "../nekko-js" }
nekko-loop = { path = "../nekko-loop" }
nekko-oauth = { path = "../nekko-oauth" }
nekko-settings = { path = "../nekko-settings" }
nekko-remote = { path = "../nekko-remote" }
nekko-machine = { path = "../nekko-machine" }
nekko-messaging = { path = "../nekko-messaging" }
nekko-native = { path = "../nekko-native" }
nekko-sandbox = { path = "../nekko-sandbox" }
nekko-store = { path = "../nekko-store" }
nekko-term = { path = "../nekko-term" }
nekko-tools = { path = "../nekko-tools" }
nekko-turn = { path = "../nekko-turn" }
nekko-usage = { path = "../nekko-usage" }
nekko-web = { path = "../nekko-web" }
regress.workspace = true
nekko-workspace = { path = "../nekko-workspace" }
# native-tls: `image:fetch` loads https photos. It is the TLS stack reqwest already uses here.
reqwest = { workspace = true, features = ["native-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# The mDNS responder's socket: SO_REUSEADDR before bind, multicast membership per interface.
socket2 = "0.6"
# The OS name and version the Send feedback sheet may share (feedback.rs); nekko-machine already builds it.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio.workspace = true
tokio-tungstenite.workspace = true
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# Signs the Change proofs a phone sends in the relay itest (IO-33 FA-3).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
tempfile = "3"
