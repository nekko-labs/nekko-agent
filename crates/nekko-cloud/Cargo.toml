[package]
name = "nekko-cloud"
description = "Nekko Cloud for the engine daemon: sign-in through Supabase Auth, the device token, and end-to-end encrypted chat sync (Pro and Team) on top of nekko-sync. The server only ever receives ciphertext."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nekko-js = { path = "../nekko-js" }
nekko-net = { path = "../nekko-net" }
nekko-store = { path = "../nekko-store" }
nekko-sync = { path = "../nekko-sync" }
nekko-vault = { path = "../nekko-vault" }
# native-tls: Nekko Cloud and Supabase are HTTPS. It is the TLS stack reqwest already uses here.
reqwest = { workspace = true, features = ["native-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"
