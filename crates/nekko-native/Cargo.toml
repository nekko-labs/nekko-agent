[package]
name = "nekko-native"
description = "What the desktop app needs from the operating system, for the engine daemon: native dialogs, opening paths, the microphone permission, and the self-updater (electron-builder's release feed)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
nekko-net = { path = "../nekko-net" }
raw-window-handle = "0.6"
reqwest = { workspace = true, features = ["native-tls", "stream"] }
# Only the XDG portal on Linux (parented by X11 window id); no Wayland or GTK libraries to link.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
opener = { version = "0.9", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
url = "2.5"
# Only `YamlLoader::load_from_str`: no byte decoding, so no `encoding` feature (and its old encoding_rs).
yaml-rust2 = { version = "0.13", default-features = false }

[target.'cfg(windows)'.dependencies]
# The microphone's privacy setting, read the way Electron reads it (Windows.Devices.Enumeration).
windows = { version = "0.62", features = ["Devices_Enumeration", "Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
