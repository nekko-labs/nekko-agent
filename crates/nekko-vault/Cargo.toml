[package]
name = "nekko-vault"
description = "Where this device's secrets live: the OS keystore (macOS Keychain, Windows Credential Manager), or a 0600 file where there is none."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nekko-js = { path = "../nekko-js" }
serde_json.workspace = true
sha2 = "0.10"

# The OS keystore on macOS (Keychain) and Windows (Credential Manager). Linux
# keeps secrets in a 0600 file instead: Secret Service needs a desktop session
# and D-Bus, which headless installs don't have.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
