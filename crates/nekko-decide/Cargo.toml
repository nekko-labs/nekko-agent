[package]
name = "nekko-decide"
description = "Local decision models (Laya): a native ONNX Runtime session that answers typed questions with calibrated probabilities, in the TypeSafe Jev response shape."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# CUDA on Linux, opt-in and not in release builds (docs/decision-models.md, "CUDA on Linux"):
# it needs the CUDA 13 runtime and cuDNN 9 at run time, and the prebuilt ONNX Runtime this
# downloads has no kernels for RTX 50-series GPUs, so build it against Microsoft's CUDA build
# instead (`ORT_LIB_LOCATION=<lib> ORT_PREFER_DYNAMIC_LINK=1`, see
# scripts/decision-models/cuda-golden.sh). Without it Linux runs on the CPU provider.
cuda = ["ort/cuda"]

[dependencies]
ort = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

# Execution providers, per target: each maps to the prebuilt ONNX Runtime pyke ships for it
# (see ort-sys's dist table). A provider that fails to start at run time falls back to CPU.
[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["directml"] }
# Picking and loading the DirectML.dll nekkod delay-loads (src/directml.rs).
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }
