name: Pending response safety checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/ios/Protocol/**
      - .github/workflows/pending-response-checks.yml
permissions:
  contents: read
jobs:
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run full native protocol and app-state tests without a Mac
        run: apps/ios/scripts/linux-test.sh
