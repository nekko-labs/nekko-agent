name: Release

on:
  push:
    tags:
      # A full release tag, pushed by a person: `v0.9.0` starts the 0.9 line
      # (docs/decisions/0055). A short `v0.9` is expanded to `v0.9.0` by
      # version-release.yml. The nightly counter tags (`nightly/<platform>/...`)
      # match neither, and are pushed with GITHUB_TOKEN, which starts nothing.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Dispatched at a tag by version-release.yml (a tag pushed with GITHUB_TOKEN
  # can't trigger the push event above), and usable by hand to re-run a release
  # for an existing tag. Use --ref v1.2.3 for tag-local tooling, or
  # --ref main -f release_tag=v1.2.3 for current tooling and immutable tag source.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable tag to rebuild with current tooling (desktop only)'
        required: false
        type: string

# Recovery runs use current workflow/tooling but check out application code from
# the existing tag. They do not re-publish npm packages or reserve a new version.
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, xcode-27, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Signing is secret-gated: with no signing secrets configured the macOS
    # build ships unsigned (ad-hoc signed by the afterPack hook), exactly as it
    # did before. The env indirection exists because `secrets` cannot be read
    # in a step-level `if`. Secret names and setup: docs/signing.md.
    env:
      MACOS_SIGNING_CERTS_P12: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # base64 of the Developer ID .provisionprofile that authorizes the main
      # executable's restricted entitlements (Touch ID passkeys).
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      # Windows signs through Azure Artifact Signing (formerly Trusted
      # Signing). The service principal's client id is the gate, like the
      # macOS certificate above.
      AZURE_SIGNING_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected a full existing release tag.' >&2; exit 1; }
          # x.xx.xxxx from the 0.10 line on (docs/decisions/0080,
          # canonicalReleaseTag in scripts/nightly-version.mjs). Older 0.x tags
          # still pass so they can be rebuilt.
          major=$((10#${BASH_REMATCH[1]})); minor=$((10#${BASH_REMATCH[2]})); patch=$((10#${BASH_REMATCH[3]}))
          if (( minor > 99 )) || (( minor >= 10 && patch < 1000 )) || (( minor < 10 && major > 0 )); then
            echo "$RELEASE_TAG is not x.xx.xxxx: release the line as vMAJOR.MINOR.1000 with MINOR 10-99 (for example v0.10.1000), or push the short vMAJOR.MINOR." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Record immutable application source
        shell: bash
        run: |
          echo "Application tag: $RELEASE_TAG"
          git rev-parse HEAD
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: |
            scripts/release-electron.mjs
            scripts/release-builder-tools.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A tagged release that is *partially* configured is the dangerous case:
      # it would publish a signed-but-unnotarized app that Gatekeeper still
      # blocks, and look like it worked. Fail before building instead.
      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          # The certificate is what decides whether we sign at all, so it is
          # the gate. No cert means an unsigned build, which is a supported
          # outcome, not an error — even if stray notarization secrets are
          # lying around.
          #
          # (Hypergate fails on *any* partially populated set. That is stricter
          # than it needs to be: it turns a leftover secret into a hard build
          # failure while the cert is still missing.)
          if [ -z "${MACOS_SIGNING_CERTS_P12:-}" ]; then
            echo 'No Developer ID certificate configured, building unsigned.'
            for name in MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER MACOS_PROVISIONING_PROFILE; do
              if [ -n "${!name:-}" ]; then
                echo "Note: $name is set but unused without MACOS_SIGNING_CERTS_P12." >&2
              fi
            done
            exit 0
          fi

          # A cert *is* present, so this build will be signed. Anything missing
          # now yields a signed-but-unnotarized app: still Gatekeeper-blocked,
          # while looking like the release worked. Without the provisioning
          # profile it yields an app macOS refuses to launch (#2688). Fail
          # before building.
          missing=()
          for name in MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER MACOS_PROVISIONING_PROFILE; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'macOS signing configuration is incomplete. Missing: %s\n' "${missing[*]}" >&2
            echo 'Secrets are listed in docs/signing.md, "Secrets" and "Provisioning profile".' >&2
            exit 1
          fi
          echo 'macOS signing fully configured.'

      # electron-builder.yml names build/nekko-agent.provisionprofile, which is
      # never committed. Write it from the secret and check it authorizes the
      # main executable's entitlements now: a wrong profile is otherwise found
      # only when the shipped app will not open (#2688). A tag from before the
      # profile has no check script and no use for the file.
      - name: Install the macOS provisioning profile
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          profile=apps/desktop/build/nekko-agent.provisionprofile
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$profile"
          if [ -f apps/desktop/scripts/check-provisioning-profile.cjs ]; then
            node apps/desktop/scripts/check-provisioning-profile.cjs "$profile"
          else
            echo "$RELEASE_TAG predates the provisioning profile; not checking it."
          fi

      # The notary key is the credential that actually breaks between
      # releases: an App Store Connect API key can be revoked or rotated in
      # Apple's portal without any secret here changing. electron-builder only
      # finds out after the full build and signing pass, as a bare
      # `HTTP status code: 401` five minutes in. Ask notarytool for the
      # submission history first: read-only, a few seconds, and it fails with
      # the same 401 a dead key would produce later.
      - name: Validate the notary credentials
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary-preflight-key.p8"
          err="$RUNNER_TEMP/notary-preflight.err"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
          if ! xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" >/dev/null 2>"$err"; then
            cat "$err" >&2
            echo 'Apple rejected the notary credentials (APPLE_API_KEY_ID / APPLE_API_KEY_P8 / APPLE_API_ISSUER).' >&2
            echo 'Most likely the App Store Connect API key was revoked or rotated. See docs/signing.md, "When the App Store Connect key rotates".' >&2
            rm -f "$key"
            exit 1
          fi
          rm -f "$key"
          echo 'Notary credentials accepted by App Store Connect.'

      # Same rule as macOS: no service principal means an unsigned build (a
      # supported outcome); a partial set fails here rather than producing an
      # installer that SmartScreen flags while the release looks fine.
      - name: Validate Windows signing configuration
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          set -euo pipefail
          names=(AZURE_SIGNING_TENANT_ID AZURE_SIGNING_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE AZURE_SIGNING_PUBLISHER)
          if [ -z "${AZURE_SIGNING_CLIENT_ID:-}" ]; then
            echo 'No Azure Artifact Signing configured, building unsigned.'
            for name in "${names[@]}"; do
              if [ -n "${!name:-}" ]; then
                echo "Note: $name is set but unused without AZURE_SIGNING_CLIENT_ID." >&2
              fi
            done
            exit 0
          fi
          missing=()
          for name in "${names[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Windows signing configuration is incomplete. Missing: %s\n' "${missing[*]}" >&2
            echo 'Secrets and variables are listed in docs/signing.md, "Windows".' >&2
            exit 1
          fi
          echo 'Windows signing fully configured.'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The engine daemon ships inside the installer; `npm run release` builds
      # it (apps/desktop/scripts/stage-daemon.mjs) and fails without cargo.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Electron and the tools electron-builder fetches from GitHub (NSIS,
      # signing helpers), kept in the Actions cache. The nightly on main saves
      # it and a tag build restores it, so a GitHub download outage cannot
      # fail a release (v0.9.5's first run died on a 504 for Electron).
      - name: Point Electron's downloads at a cached folder
        id: electron-cache
        shell: bash
        run: |
          echo "electron_config_cache=${{ runner.temp }}/electron-cache/electron" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=${{ runner.temp }}/electron-cache/electron-builder" >> "$GITHUB_ENV"
          echo "versions=$(node -p "const p=require('./package-lock.json').packages; p['node_modules/electron'].version+'-'+p['node_modules/electron-builder'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ steps.electron-cache.outputs.versions }}
      - run: npm ci
      # The tag is the version (docs/decisions/0055): package.json versions are
      # no longer bumped in PRs, so the installers take theirs from here. After
      # `npm ci`, as publish-cli does, so the lockfile is installed untouched.
      - name: Stamp the tag's version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "$RELEASE_TAG is not a release tag; run this workflow with --ref vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          npm pkg set "version=$version"
          npm pkg set "version=$version" -w @nekko-agent/desktop -w @nekko-agent/local-web-ui
      - name: Download and verify official Electron
        id: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .release-tools/scripts/release-electron.mjs
      - name: Download and verify packaging tools
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .release-tools/scripts/release-builder-tools.mjs
      - run: npm run build

      # Build installers (Windows: NSIS, macOS: dmg/zip, Linux:
      # AppImage/deb) and upload them to a draft GitHub Release for this tag.
      #
      # Windows signs with Azure Artifact Signing: electron-builder runs
      # Invoke-TrustedSigning with win.azureSignOptions (passed as -c flags so
      # a local `npm run dist` never tries to reach Azure) and authenticates
      # from AZURE_TENANT_ID/AZURE_CLIENT_ID/AZURE_CLIENT_SECRET. macOS reads
      # CSC_LINK/CSC_KEY_PASSWORD, and
      # APPLE_API_KEY (a *path* to the .p8, hence the temp file) with
      # APPLE_API_KEY_ID/APPLE_API_ISSUER to notarize.
      - name: Build and publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_DIST: ${{ steps.electron.outputs.electron_dist }}
          CSC_LINK: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          AZURE_SIGNING_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_SIGNING_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${AZURE_SIGNING_CLIENT_ID:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export AZURE_TENANT_ID="$AZURE_SIGNING_TENANT_ID"
            export AZURE_CLIENT_ID="$AZURE_SIGNING_CLIENT_ID"
            export AZURE_CLIENT_SECRET="$AZURE_SIGNING_CLIENT_SECRET"
            # publisherName also lands in app-update.yml, where electron-updater
            # checks that every later update is signed by the same publisher.
            EXTRA=(
              "-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT"
              "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_PROFILE"
              "-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER"
            )
            echo 'Windows: signing with Azure Artifact Signing.'
          elif [ "$RUNNER_OS" = "Windows" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo 'Windows: building UNSIGNED (no Azure Artifact Signing configured).'
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "${CSC_LINK:-}" ]; then
            key="$RUNNER_TEMP/notary-api-key.p8"
            # Subshell so the restrictive umask applies to the key file only,
            # not to every artifact the build writes afterwards.
            (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
            export APPLE_API_KEY="$key"
            EXTRA=(-c.mac.notarize=true)
            echo 'macOS: signing with Developer ID and notarizing.'
          else
            # No certificate. Clear the signing env so electron-builder does not
            # try to sign with an empty cert path, and let the afterPack hook
            # ad-hoc sign instead.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo 'macOS: building UNSIGNED (no Developer ID cert configured).'
            fi
          fi
          npm run release -w @nekko-agent/desktop -- "-c.electronDist=$ELECTRON_DIST" ${EXTRA[@]+"${EXTRA[@]}"}

      # Sign the update feed electron-builder just published (latest*.yml) with
      # the release signing key and upload `<file>.sig` beside each one; the
      # updater checks it against the key built into the app before trusting
      # the feed. While that built-in key is the placeholder, a missing secret
      # only warns; once a real key is built in, it fails the release, as does
      # a secret that does not match. docs/signing.md, "The release signing key".
      - name: Sign the update feed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEKKO_RELEASE_SIGNING_KEY: ${{ secrets.NEKKO_RELEASE_SIGNING_KEY }}
          # "1" only for the bridge release of a key rotation (docs/signing.md).
          NEKKO_RELEASE_KEY_ROTATION: ${{ vars.NEKKO_RELEASE_KEY_ROTATION }}
        run: |
          set -euo pipefail
          # Not a process substitution: its exit status would be ignored.
          out=$(node scripts/sign-update-feed.mjs apps/desktop/release)
          sigs=()
          if [ -n "$out" ]; then mapfile -t sigs <<<"$out"; fi
          if [ "${#sigs[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${sigs[@]}" --clobber
          fi

      # Only nekko-vm may create VMs (apps/desktop/scripts/sign-mac.cjs): it must
      # carry the virtualization entitlement and nothing else in the app may.
      # Only the main executable may carry a restricted entitlement, and a
      # signed app must carry them and embed the profile. Signed or not, and a
      # file codesign cannot read fails it. docs/signing.md.
      - name: Check the entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/release -maxdepth 2 -name '*.app' -print -quit)
          if [ -n "${MACOS_SIGNING_CERTS_P12:-}" ] && [ -f apps/desktop/scripts/check-provisioning-profile.cjs ]; then
            scripts/check-mac-entitlements.sh "$app" --signed
          else
            scripts/check-mac-entitlements.sh "$app"
          fi

      # Proof the artifact is actually distributable, rather than trusting that
      # the build steps above did what they claim.
      - name: Verify the signed app
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/release -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo 'No .app found to verify.' >&2
            exit 1
          fi
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          # The notarization ticket is stapled to the .app, not to the .dmg
          # that wraps it, so this is the artifact to validate.
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          # macOS checks restricted entitlements against the embedded profile
          # only when the binary starts, so every check above passed on
          # 0.10.1000, which no Mac would open (#2688). Start it for real.
          bin="$app/Contents/MacOS/$(defaults read "$PWD/$app/Contents/Info" CFBundleExecutable)"
          # 0.10.1000 exits 137 here (SIGKILL at exec).
          if ! ELECTRON_RUN_AS_NODE=1 "$bin" -e 'process.exit(0)'; then
            echo "$bin did not start. If the system log shows amfid 'No matching profile found', the provisioning profile does not authorize the entitlements (docs/signing.md, \"Provisioning profile\")." >&2
            log show --last 2m --style compact --predicate 'process == "amfid" OR (process == "kernel" AND eventMessage CONTAINS "AMFI")' 2>/dev/null | tail -20 >&2 || true
            exit 1
          fi
          echo 'The signed app starts.'

      - name: Verify the signed installer
        if: runner.os == 'Windows' && env.AZURE_SIGNING_CLIENT_ID != ''
        shell: pwsh
        env:
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem apps/desktop/release -Filter '*.exe' -File) +
                   @(Get-ChildItem apps/desktop/release/win-unpacked -Filter '*.exe' -File)
          if ($files.Count -lt 2) { throw 'Expected the installer and the app .exe to verify.' }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notlike "*CN=$env:AZURE_SIGNING_PUBLISHER*") {
              throw "$($f.Name) is signed by '$($sig.SignerCertificate.Subject)', expected publisher '$env:AZURE_SIGNING_PUBLISHER'."
            }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name) has no timestamp; it would stop verifying when the certificate expires." }
          }

  publish-release:
    name: Publish GitHub release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tagged release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          # Look the release up by listing rather than via /releases/tags/{tag}.
          # That endpoint only resolves *published* releases and 404s on a
          # draft, which is exactly what electron-builder just created, so the
          # job could never publish the thing it was written to publish.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$RELEASE_TAG\")) | first")
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "No release found for tag $RELEASE_TAG." >&2
            exit 1
          fi
          release_id=$(jq -r '.id' <<<"$release")
          existing_body=$(jq -r '.body // ""' <<<"$release")
          generated_body=$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$RELEASE_TAG" \
            --jq '.body')
          if [ -n "$existing_body" ]; then
            body=$(printf '%s\n\n%s' "$existing_body" "$generated_body")
          else
            body="$generated_body"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" \
            -F body="$body"

  publish-cli:
    name: Publish CLI package
    if: ${{ !inputs.release_tag }}
    # After publish-web: it publishes the @nekko-agent/nekkod-* packages this one pins.
    needs: [release, publish-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.5.1
      - name: Show publish tool versions
        run: |
          node --version
          npm --version
      - name: Publish the nekko-agent CLI
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $RELEASE_TAG does not contain a valid npm version." >&2
            exit 1
          fi
          published_version=$(npm view "nekko-agent@$version" version 2>/dev/null || true)
          if [ "$published_version" = "$version" ]; then
            echo "nekko-agent@$version is already published; skipping."
            exit 0
          fi
          # Install from the committed lockfile before touching any version.
          # Re-resolving it here (npm install --package-lock-only) let npm 11
          # rearrange nested platform packages, and v0.8.1's esbuild postinstall
          # then found another esbuild's binary. The lockfile does not need the
          # tag's version; only the published package.json does.
          npm ci
          npm pkg set "version=$version" --workspace=apps/cli
          npm run build:core
          # The CLI's local mode runs nekkod: npm installs the one for this machine
          # (apps/cli/src/engine.ts finds it), at the same version.
          for key in win32-x64 linux-x64 linux-arm64 darwin-arm64; do
            npm pkg set "optionalDependencies.@nekko-agent/nekkod-$key=$version" --workspace=apps/cli
          done
          publish_args=(npm publish --workspace=apps/cli --access public)
          if [ -n "${NPM_TOKEN:-}" ]; then
            publish_args+=(--provenance)
            echo 'NPM_TOKEN is present; using token fallback for this publish.'
          else
            echo 'NPM_TOKEN is absent; attempting npm Trusted Publishing over OIDC.'
          fi
          set +e
          "${publish_args[@]}" 2>&1 | tee /tmp/nekko-agent-npm-publish.log
          publish_status=${PIPESTATUS[0]}
          set -e
          if [ "$publish_status" -ne 0 ]; then
            echo 'npm publish failed. Configure the npm Trusted Publisher for nekko-labs/nekko-agent/release.yml, or provide NPM_TOKEN during bootstrap.' >&2
            exit "$publish_status"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nekkod-npm:
    name: Build nekkod for npm
    if: ${{ !inputs.release_tag }}
    uses: ./.github/workflows/nekkod-npm.yml

  # The self-hosted Local Web UI (`npx nekko-agent-local-web-ui`) and the per-platform
  # engine daemons it installs as optional dependencies. Gated exactly like
  # publish-cli: an NPM_TOKEN secret, or npm Trusted Publishing over OIDC. The
  # owner must own the @nekko-agent scope on npm and register this workflow as
  # a trusted publisher for nekko-agent-local-web-ui and each @nekko-agent/nekkod-* package.
  publish-web:
    name: Publish Local Web UI package
    if: ${{ !inputs.release_tag }}
    needs: [release, nekkod-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v7
        with:
          pattern: nekkod-*
          path: nekkod-bins
          merge-multiple: true
      - name: Publish the nekkod packages, then nekko-agent-local-web-ui
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $RELEASE_TAG does not contain a valid npm version." >&2
            exit 1
          fi
          provenance=()
          if [ -n "${NPM_TOKEN:-}" ]; then
            provenance=(--provenance)
            echo 'NPM_TOKEN is present; using token fallback for these publishes.'
          else
            echo 'NPM_TOKEN is absent; attempting npm Trusted Publishing over OIDC.'
          fi
          publish() { # <dir> <name>
            if [ "$(npm view "$2@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$2@$version is already published; skipping."
              return 0
            fi
            (cd "$1" && npm publish --access public "${provenance[@]}") || {
              if [[ "$2" == @nekko-agent/* ]]; then
                echo "npm publish of $2 failed. A 404 here means the @nekko-agent npm organization does not exist or NPM_TOKEN cannot write to it; see docs/signing.md, 'The @nekko-agent scope'." >&2
              else
                echo "npm publish of $2 failed. Configure the npm Trusted Publisher for nekko-labs/nekko-agent/release.yml, or provide NPM_TOKEN." >&2
              fi
              return 1
            }
          }
          # The platform packages first: the bundle pins them at this version.
          node apps/local-web-ui/scripts/nekkod-packages.mjs --bins nekkod-bins --out npm-nekkod --version "$version" --require-all
          for dir in npm-nekkod/*/; do
            publish "$dir" "$(node -p "require('./${dir}package.json').name")"
          done
          # As in publish-cli: install from the committed lockfile, then set the version.
          npm ci
          npm pkg set "version=$version" --workspace=apps/local-web-ui
          npm run build:web
          npm run bundle -w @nekko-agent/local-web-ui
          publish apps/local-web-ui/cli-dist nekko-agent-local-web-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'