name: iOS TestFlight

# Archives the native iPhone app (with its widget, share, Watch and Watch
# widget extensions), signs it for the App Store with Xcode's cloud-managed
# signing, and uploads it to App Store Connect, where it appears in TestFlight
# after Apple's processing (usually 5-30 minutes).
#
# Runs on its own nightly on main, and uploads only when what the app ships
# (apps/ios/ minus its tests, scripts, evidence and Markdown, plus the bundled
# Mermaid) changed since the last successful upload from main, so a night with
# no app change uploads nothing. By hand it always uploads:
#   gh workflow run ios-testflight.yml
#
# Signing uses the App Store Connect API key the desktop release already holds
# for notarization (APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER). No
# certificate or provisioning profile lives in the repo: `-allowProvisioningUpdates`
# lets Xcode register the bundle ids and the App Group, and create the
# distribution certificate and profiles, through that key. For that the key
# needs the Admin role (or App Manager with access to cloud-managed
# distribution certificates); a Developer-role key archives but cannot export.
#
# The archive step signs with one fixed Apple Development identity
# (IOS_DEV_CERT_P12 / IOS_DEV_CERT_PASSWORD repository secrets) so Xcode does
# not create a new certificate on every run; see docs/runbooks/ios-release.md.
#
# Team id: the APPLE_TEAM_ID repository variable, else read from the
# Developer ID certificate in MACOS_SIGNING_CERTS_P12 (its OU is the team id).
#
# Owner-side, once, before the first run (TASKS IO-7):
#   - create the app record in App Store Connect with the bundle id below
#     (Apple's API cannot create apps);
#   - export compliance is answered in Info.plist (ITSAppUsesNonExemptEncryption
#     false: every cipher is Apple's own, CryptoKit and URLSession); revisit it if
#     the app ever bundles a crypto library of its own.
#
# Version (docs/decisions/0055): every upload reserves the next iOS BUILD since
# the newest release tag (scripts/nightly-version.mjs, kept as the counter tag
# nightly/ios/v<version>) and is stamped MARKETING_VERSION = MAJOR.MINOR.BUILD,
# CURRENT_PROJECT_VERSION (CFBundleVersion) = MAJOR*10000000 + MINOR*10000 +
# BUILD, on the app and every extension. Never reused, even for a re-run of the
# same commit: App Store Connect refuses a build number it has seen. The
# values in apps/ios/project.yml are only for local builds. (Before 0.8.1,
# builds were numbered run number + 100, up to 179; the new numbers start at
# 80001.)
#
# Internal testing only (Philip, 2026-11-06): a new marketing version every
# night is fine because no build from here goes to external testers. The
# export marks each build testFlightInternalTestingOnly, so App Store Connect
# refuses to add it to an external group, send it to Beta App Review or submit
# it to the App Store; the internal-testers job then adds it to the internal
# groups. A dispatch with internal_only=false is the only way around that.

on:
  schedule:
    # 04:07 JST, after the nightly Native iOS run.
    - cron: '7 19 * * *'
  workflow_dispatch:
    inputs:
      notes:
        description: What to test (shown to testers as the build's notes in the summary)
        required: false
        default: ''
      only_if_changed:
        description: Upload only if the app's sources changed since the last upload from main
        type: boolean
        required: false
        default: false
      internal_only:
        description: Internal TestFlight testing only (never external testers or the App Store). Scheduled runs always are.
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  # The changed job reads this workflow's earlier runs.
  actions: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # On a runner that costs little: whether there is anything to ship.
  changed:
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.diff.outputs.ship }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && !inputs.only_if_changed }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then echo "By hand: uploading."; echo ship=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ON_MAIN" != true ]; then echo "Automatic uploads are from main only."; echo ship=false >> "$GITHUB_OUTPUT"; exit 0; fi
          # The last successful run on main: it uploaded, or found nothing new
          # since the one before, so diffing from it is diffing from the last upload.
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-testflight.yml --branch main --status success \
            --limit 1 --json headSha -q '.[0].headSha // ""')
          if [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            echo "No earlier upload from main to compare with: uploading."
            echo ship=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$last" HEAD -- apps/ios vendor/mermaid \
            | grep -vE '^apps/ios/(UITests|Tests|Protocol/Tests|scripts|evidence)/|\.md$' || true)
          if [ -n "$files" ]; then
            echo "Changed since ${last::7}:"; echo "$files"
            echo ship=true >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the app ships changed since ${last::7}."
            echo ship=false >> "$GITHUB_OUTPUT"
          fi

  # Reserved on a cheap runner, only when there is something to upload. A
  # failed upload leaves a gap in the count, which is harmless.
  version:
    needs: changed
    if: needs.changed.outputs.ship == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-version-ios
      cancel-in-progress: false
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      code: ${{ steps.reserve.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: reserve
        run: node scripts/nightly-version.mjs --platform ios --reserve

  upload:
    needs: [changed, version]
    if: needs.changed.outputs.ship == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_SIGNING_CERTS_P12: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the signing secrets
        run: |
          missing=()
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}. Add the App Store Connect API key (Admin role) as repository secrets." >&2
            exit 1
          fi

      - name: Find the team id
        run: |
          set -euo pipefail
          team="${APPLE_TEAM_ID:-}"
          if [ -z "$team" ] && [ -n "${MACOS_SIGNING_CERTS_P12:-}" ]; then
            p12="$RUNNER_TEMP/certs.p12"
            (umask 077; printf '%s' "$MACOS_SIGNING_CERTS_P12" | base64 --decode > "$p12")
            team="$(openssl pkcs12 -in "$p12" -passin env:MACOS_CERT_PASSWORD -nokeys -legacy 2>/dev/null \
              | openssl x509 -noout -subject -nameopt multiline 2>/dev/null \
              | awk -F' = ' '/organizationalUnitName/ {print $2; exit}')" || true
            rm -f "$p12"
          fi
          if ! [[ "$team" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::No team id. Set the APPLE_TEAM_ID repository variable (Membership details at developer.apple.com/account)." >&2
            exit 1
          fi
          echo "TEAM_ID=$team" >> "$GITHUB_ENV"
          echo "Team: $team"

      # The image's default Xcode is its newest release; newer ones there are release candidates.
      - name: Show the Xcode
        run: xcodebuild -version

      - name: Write the API key
        run: |
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
          echo "API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Automatic signing archives with an Apple Development identity. A clean
      # runner has none, so without this Xcode mints a new certificate through
      # the API key on every run, and the account's certificate cap fills up
      # after a handful of uploads. With one fixed CI identity in the keychain
      # Xcode reuses it. The App Store export still uses cloud-managed signing.
      - name: Import the CI development identity
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${IOS_DEV_CERT_P12:-}" ]; then
            echo "::warning::IOS_DEV_CERT_P12 is not set, so Xcode will create a new Apple Development certificate this run. See docs/runbooks/ios-release.md."
            exit 0
          fi
          kc="$RUNNER_TEMP/signing.keychain-db"; pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          p12="$RUNNER_TEMP/dev.p12"
          (umask 077; printf '%s' "$IOS_DEV_CERT_P12" | base64 --decode > "$p12")
          security import "$p12" -k "$kc" -P "$IOS_DEV_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q 'Apple Development' \
            || { echo "::error::IOS_DEV_CERT_P12 holds no Apple Development identity." >&2; exit 1; }

      - name: Generate the project
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate

      # Debug builds keep the development push environment; the App Store
      # export re-signs with production, so the entitlement is switched here
      # rather than in the checked-in file the simulator jobs use.
      - name: Production push environment
        run: /usr/libexec/PlistBuddy -c 'Set :aps-environment production' apps/ios/App/NekkoNative.entitlements

      - name: Archive
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project NekkoNative.xcodeproj -scheme NekkoNative -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NekkoNative.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(\*\*|error:|warning: .*[Ss]ign)' || true
          test -d "$RUNNER_TEMP/NekkoNative.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      # testFlightInternalTestingOnly makes App Store Connect itself refuse to
      # put the build in an external group, send it to Beta App Review or submit
      # it to the App Store (Philip, 2026-11-06: nightlies are for internal
      # testers only). Only a dispatch with internal_only=false leaves it off.
      - name: Export and upload to App Store Connect
        env:
          INTERNAL_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.internal_only }}
        run: |
          set -o pipefail
          if [ "$INTERNAL_ONLY" = true ]; then internal='<true/>'; else internal='<false/>'; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
            <key>testFlightInternalTestingOnly</key>${internal}
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/NekkoNative.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40

      - name: Summary
        if: always()
        env:
          # By hand, what the dispatcher typed; on a push, the merged PR's title.
          NOTES: ${{ inputs.notes || github.event.head_commit.message }}
        run: |
          {
            echo "### iOS TestFlight upload"
            echo "- Version $VERSION, build $BUILD_NUMBER, commit \`${GITHUB_SHA::7}\`"
            echo "- Team ${TEAM_ID:-unknown}; bundle id dev.nekkolabs.nekkoagent"
            [ -n "$NOTES" ] && echo "- What to test: $(printf '%s\n' "$NOTES" | head -n1)"
            echo "- Internal TestFlight testing only: the internal-testers job adds it to the internal groups once Apple has processed it."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "${API_KEY_PATH:-}"

  # After Apple's processing (usually 5-30 minutes), add the build to every
  # internal TestFlight group that does not already get every build. Never an
  # external group, never Beta App Review (scripts/testflight-internal.mjs
  # cannot make either request). Waiting on a Linux runner keeps the Mac free.
  internal-testers:
    needs: [version, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - name: Add the build to the internal TestFlight groups
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ needs.version.outputs.code }}
        run: |
          node scripts/testflight-internal.mjs --bundle-id dev.nekkolabs.nekkoagent \
            --version "$VERSION" --build "$BUILD_NUMBER" --wait-minutes 45
