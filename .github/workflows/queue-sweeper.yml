name: Queue sweeper

# auto-merge.yml arms native auto-merge when a PR opens, leaves draft or gets
# a push. Two things still left ready PRs sitting open with nobody watching:
#
#   - The arm step failed (an API hiccup) and nothing retried it.
#   - A PR-tier job flakes once (a 30 s Playwright timeout on the Windows
#     capture runner) and the PR stays red until someone re-runs it by hand.
#
# Every 15 minutes this looks at every ready PR into main and:
#
#   - arms auto-merge (squash) when its head's `gate` is green, it has no
#     conflicts and auto-merge is not already armed;
#   - re-runs the failed jobs of a red `gate` once (attempt 1 only), so a
#     flake heals itself and a real failure stays red for the author.
#
# There is no merge queue since 2026-11-06; the file keeps its name so the
# runbooks and history that point at it still resolve.
#
# Drafts, stacked layers (base is not main), conflicting PRs and PRs labelled
# `hold` are left alone. queue-repair.yml takes the PRs this cannot fix: it
# merges main into a conflicting one, and hands a PR that stays red after the
# re-run to Codex. Version-release's own schedule
# releases whatever this lands.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # Re-running a PR's failed CI jobs.
  actions: write

concurrency:
  group: queue-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Arming uses the repo's GitHub App, which has write access; this job's
      # GITHUB_TOKEN is read-only.
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RUNTIME_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RUNTIME_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Sweep ready PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          prs=$(gh api graphql -F owner="$OWNER" -F name="$NAME" -f query='
            query($owner:String!,$name:String!){repository(owner:$owner,name:$name){
              pullRequests(states:OPEN,baseRefName:"main",first:100){nodes{
                id number isDraft headRefOid mergeable
                labels(first:20){nodes{name}}
                autoMergeRequest{enabledAt}
                commits(last:1){nodes{commit{statusCheckRollup{contexts(first:100){nodes{
                  ... on CheckRun{name status conclusion checkSuite{workflowRun{databaseId}}}
                }}}}}}
              }}}}' --jq '.data.repository.pullRequests.nodes[]
                | select(.isDraft | not)
                | select([.labels.nodes[].name] | index("hold") | not)
                | {id, number, head: .headRefOid, mergeable, armed: (.autoMergeRequest != null),
                   gate: ([.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]? | select(.name == "gate")] | last)}
                | @json')

          while IFS= read -r pr; do
            [ -n "$pr" ] || continue
            n=$(jq -r .number <<<"$pr")
            head=$(jq -r .head <<<"$pr")
            gate=$(jq -r '.gate.conclusion // ""' <<<"$pr")
            run=$(jq -r '.gate.checkSuite.workflowRun.databaseId // ""' <<<"$pr")

            if [ "$(jq -r .mergeable <<<"$pr")" = CONFLICTING ]; then echo "#$n: has conflicts; queue-repair.yml merges main in."; continue; fi

            case "$gate" in
              SUCCESS)
                if [ "$(jq -r .armed <<<"$pr")" = true ]; then echo "#$n: gate is green and auto-merge is armed."; continue; fi
                if gh pr merge --auto --squash "$n"; then
                  echo "#$n: gate is green and auto-merge was not armed; armed it."
                else
                  echo "::warning::Could not arm auto-merge on #$n."
                fi
                ;;
              FAILURE|CANCELLED|TIMED_OUT)
                [ -n "$run" ] || { echo "#$n: gate is $gate with no run to re-run."; continue; }
                info=$(GH_TOKEN="$ACTIONS_TOKEN" gh run view "$run" --json attempt,status,headSha) || continue
                if [ "$(jq -r .headSha <<<"$info")" != "$head" ] || [ "$(jq -r .status <<<"$info")" != completed ]; then continue; fi
                if [ "$(jq -r .attempt <<<"$info")" = 1 ]; then
                  echo "#$n: gate is $gate on the first attempt; re-running the failed jobs once."
                  GH_TOKEN="$ACTIONS_TOKEN" gh run rerun "$run" --failed || echo "::warning::Could not re-run $run for #$n."
                else
                  echo "#$n: gate is $gate after a re-run; queue-repair.yml hands it to Codex."
                fi
                ;;
              *)
                echo "#$n: gate is ${gate:-pending}."
                ;;
            esac
          done <<<"$prs"
