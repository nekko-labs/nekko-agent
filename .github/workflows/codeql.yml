name: CodeQL

# Advanced setup, replacing GitHub's default setup. Default setup analysed Swift
# on a macOS runner for every PR, whatever it changed, and could not be told
# otherwise; the Team plan's 5 macOS runners are shared by every workflow (see
# ci.yml). Here the Linux languages run on every PR and in the merge queue, and
# Swift (apps/ios) runs on the weekly schedule and when a PR carries `ci:macos`.
#
# Swift needs a build for CodeQL to trace; the protocol package is a plain
# SwiftPM package, so `swift build` covers it. The app targets need Xcode and
# signing setup and are left to the default-setup history until that is wired.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, os: ubuntu-latest, build-mode: none }
          - { language: javascript-typescript, os: ubuntu-latest, build-mode: none }
          - { language: python, os: ubuntu-latest, build-mode: none }
          - { language: rust, os: ubuntu-latest, build-mode: none }
          - { language: swift, os: macos-latest, build-mode: manual }
        exclude:
          - language: ${{ ((github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos')) || github.event_name == 'merge_group') && 'swift' || 'none' }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the Swift protocol package
        if: matrix.language == 'swift'
        working-directory: apps/ios/Protocol
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
