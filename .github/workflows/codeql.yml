name: CodeQL

# Advanced setup, replacing GitHub's default setup. Default setup analysed Swift
# on a macOS runner for every PR, whatever it changed, and could not be told
# otherwise; the Team plan's 5 macOS runners are shared by every workflow (see
# ci.yml). Here a PR analyses only the languages its files are in
# (scripts/ci-scope.mjs, codeqlLanguages); Swift (apps/ios) needs macOS, so it
# runs on the weekly schedule and on a PR that changes Swift and carries `deploy:ios`.
#
# Swift needs a build for CodeQL to trace; the protocol package is a plain
# SwiftPM package, so `swift build` covers it. The app targets need Xcode and
# signing setup and are left to the default-setup history until that is wired.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.scope.outputs.codeql }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Failure leaves the list empty, which ci-scope treats as "every language".
        run: gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt" || true
      - id: scope
        env:
          CI_CHANGED_FILES: ${{ github.event_name == 'pull_request' && format('{0}/changed.txt', runner.temp) || '' }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-scope.mjs

  analyze:
    needs: scope
    if: needs.scope.outputs.languages != '[]'
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.languages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
          # Third-party bundles pinned by hash (vendor/mermaid: scripts/vendor-mermaid.mjs) are not our source.
          config: |
            paths-ignore:
              - vendor/mermaid
      - name: Build the Swift protocol package
        if: matrix.language == 'swift'
        working-directory: apps/ios/Protocol
        run: swift build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
