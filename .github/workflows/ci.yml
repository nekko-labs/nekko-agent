name: CI

# Three tiers (scripts/ci-scope.mjs decides which jobs each run needs):
#
#   pull_request   fast feedback: build, Linux daemon, Windows capture, gated by
#                  the paths the PR touches. About 8 minutes.
#   merge_group    the merge queue: adds the Windows daemon and the speed
#                  contract for the queued group, before anything reaches main.
#   schedule       every 6 hours, and before the nightly release: every job on
#                  every OS, macOS included. Skipped when main has not moved.
#
# macOS runs on the schedule rather than per change: the Team plan runs 5 macOS
# jobs at once across every workflow, and per-PR macOS jobs queued 50-100
# minutes. `ci:macos` / `ci:perf` labels opt a single PR in.
on:
  pull_request:
  merge_group:
  schedule:
    - cron: '17 */6 * * *'
  # Full run on any branch: `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# Read-only, except `issues: write` for the scheduled run to file its failure.
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: write

# Cancel stale PR revisions; keep every queue, schedule and dispatch run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      daemon_os: ${{ steps.scope.outputs.daemon_os }}
      capture_os: ${{ steps.scope.outputs.capture_os }}
      perf: ${{ steps.scope.outputs.perf }}
      itests: ${{ steps.scope.outputs.itests }}
      run: ${{ steps.fresh.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Skip a scheduled run when main has not moved
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule --status success --limit 1 --json headSha -q '.[0].headSha' || true)
            if [ "$last" = "$GITHUB_SHA" ]; then
              echo "main is still at $GITHUB_SHA, which already passed a full run."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Changed files
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        # Failure leaves the list empty, which ci-scope treats as "run everything".
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt" || true
          else
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[].filename' > "$RUNNER_TEMP/changed.txt" || true
          fi
      - id: scope
        if: steps.fresh.outputs.run == 'true'
        env:
          CI_CHANGED_FILES: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && format('{0}/changed.txt', runner.temp) || '' }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci-scope.mjs

  build:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Build every workspace first: the cloud test suite imports @nekko-agent/host,
      # and @nekko-agent/local-web-ui imports the CLI package, so their dists must exist
      # before `npm test` / typecheck run.
      - run: npm run build:web
      # The TypeScript build is OS-independent: `perf` downloads this one rather
      # than rebuilding it. Uploaded only when perf runs, so the PR tier pays
      # nothing for it. (nekkod is per-OS and per-profile; each job builds its own.)
      - name: Upload the web build for perf
        if: needs.scope.outputs.perf == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          retention-days: 1
          path: |
            packages/*/dist/
            apps/*/dist/
            apps/desktop/out/
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to the v2 tag's commit (v2.9.2): the required job must not pick up
      # a moved tag unreviewed.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep this debug build separate from clippy/test and release caches.
          shared-key: ci-build
      - run: cargo build -p nekkod --locked
      - run: npm test
      - run: npm run test:cli-package
      - run: npm run typecheck

  # The engine daemon (crates/). Real ptys on every platform the app ships on,
  # since ConPTY and Unix ptys fail differently.
  daemon:
    needs: scope
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.daemon_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.daemon_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Host/daemon deletion parity needs a runnable daemon, not only test binaries.
      - run: cargo build -p nekkod --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # build:core takes 1-2 s here; waiting on another job's artifact would cost more.
      - run: npm run build:core
      - name: Session clearing and command-log callback parity
        run: npm run test -w @nekko-agent/host -- src/session-clear.golden.test.ts src/session-clear.timezone.test.ts src/session-log-callback.test.ts src/session-clear.daemon.test.ts

  capture:
    needs: scope
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.capture_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.capture_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache pinned native browser dependencies and release build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .scratch/agent-browser-native/cli/target
          key: native-browser-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vendor/agent-browser/pin.json', 'vendor/agent-browser/stdio.patch', 'vendor/agent-browser/main.rs', 'scripts/build-agent-browser.mjs') }}
      # Always verify the source pin/patch and run Cargo --locked, even on cache hits.
      - name: Build and stage pinned native browser
        run: node scripts/build-agent-browser.mjs
      # shared + core + host take 2-4 s here; waiting on another job's artifact would cost more.
      - run: npm run build:core
      - run: npm run build -w @nekko-agent/host
      - name: Grid model selection and mode-menu regressions
        run: npm run test:grid-bugs -w @nekko-agent/desktop
      # Consolidated end-to-end journeys (apps/desktop/e2e): hidden, non-focusable
      # Electron windows over the real renderer; replaces the per-feature sandboxes.
      - name: End-to-end journeys (Agents sidebar, chat finder)
        run: npm run test:e2e -w @nekko-agent/desktop
      - name: Fresh settings, server and page recovery regressions
        run: node apps/desktop/scripts/fresh-pages-integration.cjs
      - name: Hidden owned-window screenshots
        if: runner.os != 'Windows'
        run: node apps/desktop/scripts/capture-smoke.mjs capture-results
      - name: Hidden and actual native captures without foreground activation
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/capture-smoke.mjs capture-results --native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-${{ runner.os }}
          retention-days: 14
          path: |
            capture-results/
            .shots/wall-controls-integration/
            .shots/e2e/report/
            .shots/e2e/results/
          if-no-files-found: error

  # The speed contract (SPEC.md, "Speed & responsiveness"): headless Chrome over
  # the DevTools protocol against the Local Web UI and a scripted model. Fails
  # when a p95 exceeds its budget; the report is uploaded either way so a
  # regression shows its numbers, not only a red cross. It runs in the merge
  # queue for changes it can measure, so a regression is stopped before main,
  # and on a PR only with the `ci:perf` label.
  perf:
    needs: scope
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.perf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The Local Web UI runs behind the engine daemon, as the desktop does; the
      # server finds this release build in target/ (so the terminal keypress
      # budget measures nekkod's pty and its /api/term socket).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nekkod --release --locked
      # The web build comes from the `build` job (uploaded right after its
      # build:web, long before this release cargo build finishes). It is fetched
      # without a job-level `needs: build`, which would hold this job until all of
      # build's tests finished and lengthen the queue's critical path. If build
      # ends without uploading it, this job builds its own.
      - name: Wait for the build job's web build
        id: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for _ in $(seq 1 120); do
            if [ "$(gh api "$api/artifacts?name=web-dist" --jq '.total_count' || echo 0)" != 0 ]; then
              echo ready=true >> "$GITHUB_OUTPUT"; exit 0
            fi
            state=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.name == "build") | .status' || true)
            if [ "$state" = completed ]; then break; fi
            sleep 5
          done
          echo 'No web-dist artifact from the build job; building here.'
          echo ready=false >> "$GITHUB_OUTPUT"
      - if: steps.dist.outputs.ready == 'true'
        uses: actions/download-artifact@v7
        with:
          name: web-dist
      - if: steps.dist.outputs.ready != 'true'
        run: npm run build:web
      - name: Speed contract
        # Judged against the 2x regression gate in budgets.mjs; a missed budget is
        # measured once more before it fails the job (noisy shared runners). The
        # runner has no GPU, so Chrome runs without its software GPU emulation.
        run: node scripts/perf/run.mjs --out perf-results --attempts 3 --no-gpu
      - name: Profile streaming frame work against the unchanged base after a failed gate
        if: failure() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Diagnostic only: keep the failed speed-contract result and its budgets.
          node scripts/perf/run.mjs --out perf-results/profile-head --quick --only frames --profile --timeline --dump-trace --no-gpu || echo "Head diagnostic missed a budget; original gate remains failed."
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach ../perf-base "$BASE_SHA"
          cd ../perf-base
          npm ci
          npm run build:web
          cargo build -p nekkod --release --locked
          node scripts/perf/run.mjs --out "$GITHUB_WORKSPACE/perf-results/profile-base" --quick --only frames --profile --timeline --dump-trace --no-gpu || echo "Base diagnostic missed a budget; inspect uploaded report."
      - name: Report
        if: always()
        run: cat perf-results/perf-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          retention-days: 14
          path: perf-results/
          if-no-files-found: ignore

  # Loopback end-to-end checks: the Local Web UI behind nekkod, with scripted
  # models and fake services on 127.0.0.1 (a fake Telegram Bot API and GitHub, a
  # local relay, a Hypergate daemon from its public repo). Each script makes its
  # own temporary data dir and home and ends its process trees. Never on a PR,
  # and `gate` does not need this job: it reports on what lands on main (every
  # queue group, the schedule, a dispatch) without holding anything.
  itests:
    needs: scope
    if: needs.scope.outputs.run == 'true' && needs.scope.outputs.itests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: nekko-labs/hypergate
          path: hypergate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:web
      - run: npm run build -w @nekko-agent/relay-server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # nekkod, and the stand-in sd-server the image turn runs on.
      - run: cargo build -p nekkod --examples --bins --locked
      - name: Hypergate (for the MCP HTTP transport)
        working-directory: hypergate
        run: npm ci && npm run build -w @hypergate/shared && npm run build -w @hypergate/core
      # Each step runs whatever the one before left; `if: !cancelled()` so one
      # failure still reports the others.
      - name: Turn variants (compaction, cancel, interrupt queued, image turn)
        run: node scripts/itest-turn-variants.mjs
      - name: Phone relay through the daemon
        if: ${{ !cancelled() }}
        run: node scripts/itest-relay-daemon.mjs
      - name: Telegram bridge through the daemon
        if: ${{ !cancelled() }}
        run: node scripts/itest-messaging-daemon.mjs
      - name: Small services through the daemon
        if: ${{ !cancelled() }}
        run: node scripts/itest-small-services.mjs
      - name: MCP streamable-HTTP transport through Hypergate
        if: ${{ !cancelled() }}
        run: node scripts/itest-mcp-http.mjs --spawn hypergate

  # The one required check. It passes when every job this run needed passed and
  # the skipped ones were skipped on purpose, so branch protection and the merge
  # queue need not know which jobs a change runs. A scheduled run that fails
  # opens (or comments on) one `ci-scheduled` issue, so nobody has to watch it.
  gate:
    needs: [scope, build, daemon, capture, perf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo 'A required job failed or was cancelled.' >&2
            exit 1
          fi
      - name: File the scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The 6-hourly full CI run (every OS, macOS and the speed contract) failed on $GITHUB_SHA: $RUN_URL"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label ci-scheduled --state open --limit 1 --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label ci-scheduled --title 'Scheduled full CI is failing on main' \
              --body "$body. Fix it before the nightly release; close this issue once a scheduled run is green."
          fi
