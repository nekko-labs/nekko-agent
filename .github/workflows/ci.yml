# Temporary diagnostic branch only. Never merge this workflow.
name: PR1760 matched cold-paint diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      BASE_SHA: 42b12519687867ac51608aec0b9bb5e6a44724e6
      HEAD_SHA: b5eb5a103700771b36be2ad31f224fea5ae3cc35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 42b12519687867ac51608aec0b9bb5e6a44724e6
          path: base
      - uses: actions/checkout@v7
        with:
          ref: b5eb5a103700771b36be2ad31f224fea5ae3cc35
          path: head
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base -> target
      - name: Build both unchanged snapshots and one identical release daemon
        run: |
          cd base
          npm ci
          npm run build:web
          cargo build -p nekkod --release --locked
          cd ../head
          npm ci
          npm run build:web
      - name: Verify provenance and matched harness
        run: |
          mkdir -p results
          git -C base status --short > results/base-status.txt
          git -C head status --short > results/head-status.txt
          test ! -s results/base-status.txt
          test ! -s results/head-status.txt
          git -C head fetch --no-tags origin "$BASE_SHA"
          git -C head diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- scripts/perf crates packages/core packages/host
          git -C head diff "$BASE_SHA" "$HEAD_SHA" > results/product.diff
          printf 'base=%s\nhead=%s\ndaemon=%s/base/target/release/nekkod\n' "$BASE_SHA" "$HEAD_SHA" "$GITHUB_WORKSPACE" > results/provenance.txt
          sha256sum base/target/release/nekkod >> results/provenance.txt
          node --version >> results/provenance.txt
          google-chrome --version >> results/provenance.txt
          lscpu >> results/provenance.txt
      - name: Matched base head head base, then latency timelines
        run: |
          export NEKKOD_PATH="$GITHUB_WORKSPACE/base/target/release/nekkod"
          cd head
          for item in base-1 head-1 head-2 base-2 base-trace head-trace; do
            app="${item%%-*}"
            extra=()
            if [[ "$item" == *-trace ]]; then extra=(--timeline); fi
            set +e
            node scripts/perf/run.mjs --app "$GITHUB_WORKSPACE/$app" --out "$GITHUB_WORKSPACE/results/$item" --only latency --attempts 1 --no-gpu "${extra[@]}" > "$GITHUB_WORKSPACE/results/$item.log" 2>&1
            status=$?
            set -e
            cat "$GITHUB_WORKSPACE/results/$item.log"
            echo "$item exit=$status" | tee -a "$GITHUB_WORKSPACE/results/exit-status.txt"
            # Budget failures are measurements, not successful gate checks.
            # A harness error aborts rather than producing misleading later samples.
            if [ "$status" -gt 1 ]; then exit "$status"; fi
            test -s "$GITHUB_WORKSPACE/results/$item/perf-report.json"
          done
      - name: Summarize diagnostic reports, not a replacement gate
        if: always()
        run: |
          echo 'Diagnostic only. Original queue gate remains failed; budgets unchanged.' >> "$GITHUB_STEP_SUMMARY"
          for report in results/*/perf-report.md; do
            echo "### $report" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1760-matched-cold-paint
          retention-days: 14
          path: results/
          if-no-files-found: error
