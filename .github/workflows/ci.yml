name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-cold-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nekkod --release --locked
      - name: Same-runner base UI base latency comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison
          git rev-parse HEAD > comparison/diagnostic-sha.txt
          lscpu > comparison/cpu.txt
          # Exact queue base; UI candidate differs only in these renderer files.
          base=0c1c7c038794feb3646584e2349d063a11c409f0
          head=0ae4e75575433c72512ae4dd680ff51a6a73d865
          for phase in base-before head base-after; do
            git restore --source="$base" -- apps/desktop/src/renderer/styles.css apps/desktop/src/renderer/views/WorkspacesView.tsx
            if [ "$phase" = head ]; then
              git diff "$head^" "$head" -- apps/desktop/src/renderer/styles.css apps/desktop/src/renderer/views/WorkspacesView.tsx | git apply
            fi
            git diff -- apps/desktop/src/renderer > "comparison/$phase.patch"
            npm run build:web
            node scripts/perf/run.mjs --out "comparison/$phase" --only latency --attempts 1 --timeline --dump-trace --no-gpu --report-only
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matched-cold-paint
          path: comparison/
          retention-days: 14
