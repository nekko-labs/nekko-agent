name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: neither job writes to the repo (the perf report goes up as an
# artifact, which does not use this token).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Build every workspace first: the cloud test suite imports @nekko-agent/host,
      # and @nekko-agent/server imports the CLI package, so their dists must exist
      # before `npm test` / typecheck run.
      - run: npm run build:web
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p nekkod --locked
      - run: npm test
      - run: npm run test:cli-package
      - run: npm run typecheck

  # The engine daemon (crates/). Real ptys on every platform the app ships on,
  # since ConPTY and Unix ptys fail differently.
  daemon:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Host/daemon deletion parity needs a runnable daemon, not only test binaries.
      - run: cargo build -p nekkod --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:core
      - name: Session clearing and command-log callback parity
        run: npm run test -w @nekko-agent/host -- src/session-clear.golden.test.ts src/session-clear.timezone.test.ts src/session-log-callback.test.ts src/session-clear.daemon.test.ts

  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run build -w @nekko-agent/host
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
      - name: Build runnable notification verification daemon
        if: runner.os == 'Windows'
        run: cargo build -p nekkod --locked
      - name: Native notification CI-only safety gates
        if: runner.os == 'Windows'
        run: node --test apps/desktop/scripts/notification-integration-safety.test.cjs
      - name: TS zero-renderer notifications (injected adapter only)
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/notification-engine-integration.cjs
      - name: Daemon zero-renderer notifications (injected adapter only)
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/notification-engine-integration.cjs --daemon
      # Never enable on self-hosted runners. The launcher AND Electron child
      # require github-hosted Windows plus this explicit side-effect opt-in.
      - name: Disposable Windows native notification lifecycle and OS evidence
        if: runner.os == 'Windows' && runner.environment == 'github-hosted'
        env:
          NEKKO_CI_NATIVE_NOTIFICATIONS: '1'
        run: node apps/desktop/scripts/notification-engine-integration.cjs --daemon --native-ci
      - name: Grid model selection and mode-menu regressions
        run: npm run test:grid-bugs -w @nekko-agent/desktop
      - name: Grouped Agents sidebar regressions
        run: node apps/desktop/scripts/agent-sidebar-integration.cjs
      - name: Fresh settings, server and page recovery regressions
        run: node apps/desktop/scripts/fresh-pages-integration.cjs
      - name: Hidden owned-window screenshots
        if: runner.os != 'Windows'
        run: node apps/desktop/scripts/capture-smoke.mjs capture-results
      - name: Hidden and actual native captures without foreground activation
        if: runner.os == 'Windows'
        run: node apps/desktop/scripts/capture-smoke.mjs capture-results --native
      - name: Real native Windows notification (disposable hosted desktop only)
        if: runner.os == 'Windows'
        env:
          NEKKO_CI_NATIVE_NOTIFICATIONS: '1'
        run: node apps/desktop/scripts/native-notification-ci.cjs native-notification-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-${{ runner.os }}
          path: |
            capture-results/
            native-notification-results/
            .shots/wall-controls-integration/
            .shots/agent-sidebar-integration/
            .shots/notification-engine/
          if-no-files-found: error

  # The speed contract (SPEC.md, "Speed & responsiveness"): headless Chrome over
  # the DevTools protocol against the web edition and a scripted model. Fails
  # when a p95 exceeds its budget; the report is uploaded either way so a
  # regression shows its numbers, not only a red cross.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:web
      # The web edition runs behind the engine daemon, as the desktop does; the
      # server finds this release build in target/ (so the terminal keypress
      # budget measures nekkod's pty and its /api/term socket).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nekkod --release --locked
      - name: Speed contract
        # Judged against the 2x regression gate in budgets.mjs; a missed budget is
        # measured once more before it fails the job (noisy shared runners). The
        # runner has no GPU, so Chrome runs without its software GPU emulation.
        # NEKKO_DAEMON=nekkod: fail rather than quietly measure the in-process engine.
        env:
          NEKKO_DAEMON: nekkod
        run: node scripts/perf/run.mjs --out perf-results --attempts 3 --no-gpu
      - name: Profile failed latency gate against the unchanged base
        if: failure() && github.event_name == 'pull_request'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Diagnostic only: keep the failed speed-contract result and its budgets.
          node scripts/perf/run.mjs --out perf-results/profile-head --quick --only latency --profile --timeline --no-gpu || echo "Head diagnostic missed a budget; original gate remains failed."
          git fetch --no-tags origin "$BASE_SHA"
          git worktree add --detach ../perf-base "$BASE_SHA"
          cd ../perf-base
          npm ci
          npm run build:web
          cargo build -p nekkod --release --locked || echo "Base has no buildable nekkod; its diagnostic runs the in-process engine."
          node scripts/perf/run.mjs --out "$GITHUB_WORKSPACE/perf-results/profile-base" --quick --only latency --profile --timeline --no-gpu || echo "Base diagnostic missed a budget; inspect uploaded report."
      - name: Report
        if: always()
        run: cat perf-results/perf-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: perf-results/
          if-no-files-found: ignore
