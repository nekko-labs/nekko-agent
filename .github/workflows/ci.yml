name: CI
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Unchanged source revision to compare on one runner
        required: true
        default: bdd59fa38
permissions:
  contents: read
jobs:
  cold-browser-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nekkod --release --locked
      - run: npm run build:web
      - name: Fetch official Chrome for Testing builds
        run: |
          mkdir -p cold-browser-results
          python3 - <<'PY'
          import json, pathlib, urllib.request, zipfile
          root = pathlib.Path('cold-browser-results').resolve()
          index = json.load(urllib.request.urlopen('https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json'))
          selected = {}
          for major in (155, 156):
              rows = [v for v in index['versions'] if v['version'].startswith(str(major) + '.') and any(d['platform'] == 'linux64' for d in v.get('downloads', {}).get('chrome-headless-shell', []))]
              row = max(rows, key=lambda v: tuple(map(int, v['version'].split('.'))))
              url = next(d['url'] for d in row['downloads']['chrome-headless-shell'] if d['platform'] == 'linux64')
              if not url.startswith('https://storage.googleapis.com/chrome-for-testing-public/'):
                  raise RuntimeError('Unexpected browser download host')
              archive = root / (str(major) + '.zip')
              urllib.request.urlretrieve(url, archive)
              dest = root / str(major)
              with zipfile.ZipFile(archive) as z:
                  if any(not (dest / name).resolve().is_relative_to(dest.resolve()) for name in z.namelist()):
                      raise RuntimeError('Unsafe archive path')
                  z.extractall(dest)
              for name in ('chrome-headless-shell', 'chrome_crashpad_handler'):
                  binary = dest / 'chrome-headless-shell-linux64' / name
                  if binary.exists(): binary.chmod(0o755)
              selected[str(major)] = {'version': row['version'], 'revision': row['revision'], 'url': url}
              archive.unlink()
          (root / 'browsers.json').write_text(json.dumps(selected, indent=2))
          print(json.dumps(selected, indent=2))
          PY
      - name: Same runner, same source, full workload (155 / 156 / 155)
        run: |
          git rev-parse HEAD > cold-browser-results/source.txt
          lscpu > cold-browser-results/cpu.txt
          node --version > cold-browser-results/node.txt
          for phase in 155-before 156-middle 155-after; do
            major=${phase%%-*}
            PERF_BROWSER="$PWD/cold-browser-results/$major/chrome-headless-shell-linux64/chrome-headless-shell" node scripts/perf/run.mjs --only latency --no-gpu --report-only --out "cold-browser-results/$phase"
          done
      - name: Cold-switch timeline attribution for each browser
        run: |
          for major in 155 156; do
            PERF_BROWSER="$PWD/cold-browser-results/$major/chrome-headless-shell-linux64/chrome-headless-shell" node scripts/perf/run.mjs --only latency --timeline --no-gpu --report-only --out "cold-browser-results/trace-$major"
            gzip cold-browser-results/trace-$major/*.trace.json
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cold-browser-comparison
          path: |
            cold-browser-results/browsers.json
            cold-browser-results/*.txt
            cold-browser-results/*/*.json
            cold-browser-results/*/*.md
            cold-browser-results/*/*.gz
          retention-days: 14
