name: CI
# Diagnostic ref only for PR #2013. Never merge this workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-2013:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_SHA: 0c80faed99a2978e0f30bbb30ddc0f3b6db52b8c
      HEAD_SHA: 28701069386a3cdabff25fd2372c54cf45e22082
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 28701069386a3cdabff25fd2372c54cf45e22082
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build exact base and head with identical daemon sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          git worktree add --detach ../perf-base "$BASE_SHA"
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- crates Cargo.toml Cargo.lock scripts/perf packages apps/local-web-ui
          npm ci
          npm run build:web
          cargo build -p nekkod --release --locked
          (cd ../perf-base && npm ci && npm run build:web)
          export NEKKOD_PATH="$GITHUB_WORKSPACE/target/release/nekkod"
          {
            echo "Exact measured base: $(git -C ../perf-base rev-parse HEAD)"
            echo "Exact measured head: $(git rev-parse HEAD)"
            echo "Diagnostic workflow ref: $GITHUB_REF / $GITHUB_SHA"
            echo 'Daemon source and harness identical on both measured revisions (git diff above). One release binary for all runs.'
            sha256sum "$NEKKOD_PATH"
            node --version
            npm --version
            rustc --version
            uname -a
            lscpu
            git status --porcelain
            git -C ../perf-base status --porcelain
            git diff --stat "$BASE_SHA" "$HEAD_SHA"
          } > perf-results/provenance.txt
          echo "NEKKOD_PATH=$NEKKOD_PATH" >> "$GITHUB_ENV"
      - name: Two additional matched pairs plus separate timelines
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/perf-results"
          for phase in base-1 head-1 head-2 base-2 trace-base trace-head; do
            tree="$GITHUB_WORKSPACE"
            if [[ "$phase" == base-* || "$phase" == trace-base ]]; then tree="$GITHUB_WORKSPACE/../perf-base"; fi
            flags=()
            if [[ "$phase" == trace-* ]]; then flags+=(--timeline --dump-trace); fi
            echo "$phase $(git -C "$tree" rev-parse HEAD) $(date -u +%FT%TZ)" | tee -a "$out/order.txt"
            # Each invocation owns its seeded scratch data, mock provider and browser profile.
            (cd "$tree" && node scripts/perf/run.mjs --out "$out/$phase" --only latency --attempts 1 --no-gpu --report-only "${flags[@]}") 2>&1 | tee "$out/$phase.log"
          done
          node --input-type=module <<'NODE' | tee perf-results/comparison.md
          import fs from 'node:fs';
          import { summarize } from './scripts/perf/compare.mjs';
          const phases = Object.fromEntries(['base-1','head-1','head-2','base-2'].map(p => [p,JSON.parse(fs.readFileSync(`perf-results/${p}/perf-report.json`))]));
          for (const [p,r] of Object.entries(phases)) {
            const expected = p.startsWith('base') ? process.env.BASE_SHA : process.env.HEAD_SHA;
            if (r.git !== expected || r.attempts !== 1 || r.config.coldCycles !== 3) throw Error(`invalid provenance ${p}`);
          }
          const row=phases['base-1'].budgets.find(b=>b.id==='cold_switch_frame');
          console.log(summarize({budgets:[{...row,pass:false}]}, phases, 'latency'));
          NODE
          cat perf-results/provenance.txt perf-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matched-2013-exact-current
          path: perf-results/
          retention-days: 14
          if-no-files-found: error
