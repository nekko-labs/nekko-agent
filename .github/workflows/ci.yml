name: CI
# Diagnostic only for #1968 / #712. NEVER MERGE this branch or workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      BASE: dfb9c01b3fd722bfe79bfa922685defb45ada2b6
      HEAD: e7e6bf731a7c6e6d178598d949f16d0c8847b7dc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare exact snapshots and shared unchanged daemon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison
          git fetch origin "$BASE" "$HEAD"
          git diff "$BASE" "$HEAD" -- scripts/perf crates Cargo.lock > comparison/runtime.patch
          test ! -s comparison/runtime.patch
          git diff "$BASE" "$HEAD" > comparison/feature.patch
          git worktree add --detach ../cold-base "$BASE"
          git worktree add --detach ../cold-head "$HEAD"
          for tree in cold-base cold-head; do
            (cd ../$tree; git rev-parse HEAD; git status --porcelain) > comparison/$tree-source.txt
            (cd ../$tree; npm ci; npm run build:web)
          done
          cargo build -p nekkod --release --locked
          for tree in cold-base cold-head; do
            mkdir -p ../$tree/target/release
            cp target/release/nekkod ../$tree/target/release/nekkod
          done
          sha256sum ../cold-{base,head}/target/release/nekkod > comparison/daemon-sha256.txt
          node --version > comparison/node.txt
          lscpu > comparison/cpu.txt
      - name: Matched full latency base head base, unchanged budgets
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/comparison"
          for phase in base-before head base-after; do
            tree=cold-base
            if [ "$phase" = head ]; then tree=cold-head; fi
            (cd ../$tree; node scripts/perf/run.mjs --out "$out/$phase" --only latency --attempts 1 --timeline --dump-trace --no-gpu --report-only) 2>&1 | tee "$out/$phase.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr1968-matched-cold-latency
          path: comparison/
          retention-days: 14
