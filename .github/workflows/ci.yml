name: CI
run-name: 'Diagnostic #712: base vs lifecycle icon-seek patch'
# Temporary experiment only. Never merge this replacement into main.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-queue-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE: 13b802a04f49f453fb6ea6f4a6c1a5ed5c450aa5
      HEAD: 2ee7676b657bd5ccf89daafdf27626e30ce7d6fe
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Bounded retries for registry transport failures, never performance reruns.
      CARGO_NET_RETRY: '3'
      CARGO_HTTP_MULTIPLEXING: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record experiment and exact sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comparison
          git rev-parse HEAD > comparison/diagnostic-sha.txt
          printf 'failed_run=41760079850\nbase=%s\nhead=%s\norder=base-before,icon-seek-patch,base-after; purpose=remove lifecycle icon seeks\n' "$BASE" "$HEAD" > comparison/experiment.txt
          lscpu > comparison/lscpu.txt
          uname -a > comparison/uname.txt
          printf 'os=%s\narch=%s\nrunner=%s\nimage=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > comparison/runner.txt
          git fetch origin "$BASE" "$HEAD"
          test "$(git rev-parse "$HEAD^")" = "$BASE"
          git diff --binary "$BASE" "$HEAD" > comparison/base-to-head.patch
          git diff --stat "$BASE" "$HEAD" > comparison/base-to-head.stat
          for phase in base-before icon-seek-patch base-after; do
            sha="$BASE"
            if [ "$phase" = head ]; then sha="$HEAD"; fi
            git worktree add --detach "$RUNNER_TEMP/queue-cold/$phase" "$sha"
            mkdir -p "comparison/$phase"
            git -C "$RUNNER_TEMP/queue-cold/$phase" show -s --format=fuller HEAD > "comparison/$phase/revision.txt"
            git -C "$RUNNER_TEMP/queue-cold/$phase" rev-parse HEAD HEAD^{tree} > "comparison/$phase/source.txt"
          done
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix browser and toolchain across all phases
        shell: bash
        run: |
          set -euo pipefail
          node --version > comparison/toolchain.txt
          npm --version >> comparison/toolchain.txt
          rustc -Vv >> comparison/toolchain.txt
          cargo --version >> comparison/toolchain.txt
          browser=$(node --input-type=module -e "import { findBrowser } from './scripts/perf/lib/browser.mjs'; console.log(findBrowser());")
          echo "PERF_BROWSER=$browser" >> "$GITHUB_ENV"
          printf '%s\n' "$browser" > comparison/browser.txt
          "$browser" --version >> comparison/browser.txt
          sha256sum "$browser" >> comparison/browser.txt
      - name: Build and compare exact base with lifecycle-seek patch
        shell: bash
        run: |
          # GitHub's bash starts with -e; let the explicit phase exit-code
          # accounting record failures and continue to the remaining phases.
          set +e
          set -uo pipefail
          report="$GITHUB_WORKSPACE/comparison"
          # Shared compilation cache, but cargo builds each actual revision and
          # copies its binary before measuring. No daemon is borrowed from head.
          export CARGO_TARGET_DIR="$RUNNER_TEMP/queue-cold-target"
          failed=0
          for phase in base-before icon-seek-patch base-after; do
            out="$report/$phase"
            (
              set -euo pipefail
              cd "$RUNNER_TEMP/queue-cold/$phase"
              expected="$BASE"
              if [ "$phase" = head ]; then expected="$HEAD"; fi
              test "$(git rev-parse HEAD)" = "$expected"
              test -z "$(git status --porcelain --untracked-files=no)"
              if [ "$phase" = icon-seek-patch ]; then node "$GITHUB_WORKSPACE/scripts/perf/diagnose-icon-seek.cjs"; fi
              git diff --binary HEAD > "$out/experiment.patch"
              npm ci
              npm run build:web
              cargo build -p nekkod --release --locked
              mkdir -p target/release
              cp "$CARGO_TARGET_DIR/release/nekkod" target/release/nekkod
              export NEKKOD_PATH="$PWD/target/release/nekkod"
              sha256sum "$NEKKOD_PATH" > "$out/daemon-sha256.txt"
              git diff --binary HEAD > "$out/measured.patch"
              git status --porcelain --untracked-files=no > "$out/measured-status.txt"
              if [ "$phase" != icon-seek-patch ]; then test ! -s "$out/measured-status.txt"; fi
              "$PERF_BROWSER" --version > "$out/browser-version.txt"
              printf '%s\n' 'node scripts/perf/run.mjs --out <phase> --only latency --attempts 1 --timeline --dump-trace --no-gpu --report-only' > "$out/command.txt"
              node scripts/perf/run.mjs --out "$out" --only latency --attempts 1 --timeline --dump-trace --no-gpu --report-only
              test -s "$out/perf-report.json"
              find "$out" -type f -printf '%P\n' > "$out/files.txt"
              # A report without a timeline is not a completed diagnostic.
              find "$out" -type f -name '*trace*' | grep -q .
            ) 2>&1 | tee "$out/phase.log"
            rc=${PIPESTATUS[0]}
            printf '%s\n' "$rc" > "$out/exit-code.txt"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Upload comparison even on setup or measurement failure
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: queue-cold-icon-seek-comparison
          path: comparison/
          if-no-files-found: error
          retention-days: 14
