name: Release on version bump

# Ships a release whenever a merge to main changes the version in package.json,
# so cutting one is part of the PR that earned it rather than a manual tag
# afterwards. Bump the version, merge, and the installers appear.
#
# Why this tags *and* dispatches, rather than just tagging: a tag pushed with
# GITHUB_TOKEN does not trigger other workflows (GitHub blocks that to prevent
# recursion), so release.yml and docker.yml would never fire. Dispatching them
# explicitly at the new tag is what makes it work without a personal access
# token. `--ref <tag>` means those runs see the tag as `github.ref_name`, which
# is exactly what they get from a hand-pushed tag.

on:
  # A human merge fires this immediately.
  push:
    branches: [main]
    paths:
      - 'package.json'
  # ...but almost no merge here is human: auto-merge.yml enables auto-merge with
  # GITHUB_TOKEN, so the merge is attributed to github-actions[bot], and a push
  # from that token never starts a workflow run. That is the same recursion guard
  # that stops a bot-pushed tag from triggering release.yml. The push trigger
  # above has in fact never fired: every run in this repo's history is `schedule`
  # or `workflow_dispatch`. It silently skipped v0.6.0's release, and left
  # v0.6.1 sitting unreleased until it was dispatched by hand.
  #
  # So the primary path is now a dispatch from auto-merge.yml, which waits for
  # the PR to actually merge and then calls this workflow. The schedule below
  # stays as the backstop for anything that path misses (a merge from the web
  # UI, a direct push, a timed-out wait). Everything here is idempotent (it
  # stops when the tag already exists), so overlapping triggers are harmless.
  schedule:
    - cron: '*/15 * * * *'
  # Cut a pending release right now instead of waiting for the tick.
  workflow_dispatch:

concurrency:
  # Two ticks (or a tick and a push) must not race to create the same tag.
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "package.json version '$version' is not a release version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already tagged
        id: check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A push that touches package.json without changing the version (a
          # dependency bump, a script edit) lands here too, so the tag is the
          # thing that decides whether there is a release to cut.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the workspaces agree on the version
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The installers carry apps/desktop's version and the web edition
          # apps/web-app-server's, so a partial bump would ship assets labelled with the
          # old number. Fail before tagging rather than after publishing.
          status=0
          for pkg in apps/desktop apps/web-app-server; do
            have=$(node -p "require('./$pkg/package.json').version")
            if [ "$have" != "$VERSION" ]; then
              echo "$pkg is $have but the root is $VERSION." >&2
              status=1
            fi
          done
          exit $status

      - name: Tag it
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Build the installers and publish the release
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          gh workflow run docker.yml --ref "$TAG"
          echo "Dispatched release.yml and docker.yml at $TAG."
          echo "Watch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
