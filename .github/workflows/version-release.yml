name: Release on a version tag

# The manual MAJOR.MINOR bump (docs/decisions/0055). A person starts a new
# version line by pushing a tag `vMAJOR.MINOR.0` or the short `vMAJOR.MINOR`
# (or by creating a GitHub release with one). Nothing else changes MAJOR or
# MINOR: package.json versions are no longer bumped in PRs, and every nightly
# build counts its own BUILD from the newest such tag
# (scripts/nightly-version.mjs).
#
# A full `vMAJOR.MINOR.PATCH` tag pushed by a person starts release.yml and
# docker.yml on its own. This workflow handles the short form: it creates the
# canonical `vMAJOR.MINOR.0` tag on the same commit and dispatches those two
# workflows at it.
#
# Why this tags *and* dispatches, rather than just tagging: a tag pushed with
# GITHUB_TOKEN does not trigger other workflows (GitHub blocks that to prevent
# recursion), so release.yml and docker.yml would never fire. Dispatching them
# explicitly at the new tag is what makes it work without a personal access
# token. `--ref <tag>` means those runs see the tag as `github.ref_name`, which
# is exactly what they get from a hand-pushed tag.
#
# Earlier this workflow released whenever a merge changed package.json's
# version, on a */15 schedule (bot merges start no workflow runs). A tag pushed
# by a person does start workflows, so neither the schedule nor the dispatch
# from auto-merge.yml is needed any more.

on:
  push:
    tags:
      # The short form only; release.yml takes the full one.
      - 'v[0-9]+.[0-9]+'
  # Re-run for a short tag by hand: gh workflow run version-release.yml -f tag=v0.9
  workflow_dispatch:
    inputs:
      tag:
        description: The short release tag to expand (vMAJOR.MINOR)
        required: true

concurrency:
  # Two triggers for the same tag must not race to create the same full tag.
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Work out the release tag
        id: version
        shell: bash
        env:
          SHORT: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$SHORT" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "$SHORT is not a short release tag (vMAJOR.MINOR)." >&2
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$SHORT^{commit}" >/dev/null || { echo "No tag $SHORT." >&2; exit 1; }
          # The rule is canonicalReleaseTag() in scripts/nightly-version.mjs, in
          # bash here because the tagged commit may predate that script.
          echo "tag=$SHORT.0" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "$SHORT^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Skip if it is already tagged
        id: check
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Idempotent: a re-run, or someone who pushed both v0.9 and v0.9.0,
          # releases once (a hand-pushed v0.9.0 already started release.yml).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"

      - name: Build the installers and publish the release
        if: steps.check.outputs.fresh == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yml --ref "$TAG"
          gh workflow run docker.yml --ref "$TAG"
          echo "Dispatched release.yml and docker.yml at $TAG."
          echo "Watch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
