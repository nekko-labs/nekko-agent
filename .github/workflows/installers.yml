name: Installers

# Builds the real Windows and macOS installers, unsigned, and installs them:
# nightly, and on a PR that touches how they are packaged and carries
# `deploy:windows` or `deploy:macos` (that OS only). release.yml only runs on a
# tag, so without this a broken installer config would first show up as a
# broken release.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - apps/desktop/electron-builder.yml
      - apps/desktop/build/**
      - apps/desktop/scripts/after-pack.cjs
      - apps/desktop/scripts/sign-mac.cjs
      - apps/desktop/scripts/sign-mac-dry-run.cjs
      - apps/desktop/scripts/stage-daemon.mjs
      - scripts/check-mac-entitlements.sh
      - crates/nekkod/vm/**
      - apps/desktop/scripts/gen-dmg-art.mjs
      - .github/workflows/installers.yml
      - .github/workflows/release.yml
  schedule:
    # 03:47 JST.
    - cron: '47 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The nightly's version, MAJOR.MINOR.BUILD (docs/decisions/0055): the next
  # desktop BUILD since the newest release tag, kept as the counter tag
  # nightly/desktop/v<version> on the commit. A night with no new commit reuses
  # the version it already has. A PR, or a dispatch off main, builds with the
  # checked-in version and counts nothing.
  version:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly-version-desktop
      cancel-in-progress: false
    outputs:
      version: ${{ steps.reserve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: reserve
        run: node scripts/nightly-version.mjs --platform desktop --reserve --reuse-same-commit

  installer:
    needs: version
    if: >-
      !cancelled() && needs.version.result != 'failure' &&
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'deploy:windows') || contains(github.event.pull_request.labels.*.name, 'deploy:macos'))
    strategy:
      fail-fast: false
      # On a PR, only the labelled OS. (Each `cond && x || y` branch is non-empty.)
      matrix:
        os: ${{ fromJSON(github.event_name != 'pull_request' && '["windows-latest","xcode-27"]' || (contains(github.event.pull_request.labels.*.name, 'deploy:windows') && contains(github.event.pull_request.labels.*.name, 'deploy:macos')) && '["windows-latest","xcode-27"]' || contains(github.event.pull_request.labels.*.name, 'deploy:windows') && '["windows-latest"]' || '["xcode-27"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # After `npm ci` so the lockfile installs untouched (release.yml does the same).
      - name: Stamp the nightly version
        if: needs.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm pkg set "version=$VERSION"
          npm pkg set "version=$VERSION" -w @nekko-agent/desktop -w @nekko-agent/local-web-ui
          echo "### Desktop nightly $VERSION (${RUNNER_OS})" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Package (unsigned, not published)
        shell: bash
        run: npm run dist -w @nekko-agent/desktop -- --publish never

      # The unsigned path (after-pack.cjs re-signs nekko-vm with its own
      # entitlements): only nekko-vm may carry the virtualization entitlement.
      - name: Check the virtualization entitlement (unsigned build)
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/check-mac-entitlements.sh "$(find apps/desktop/release -maxdepth 2 -name '*.app' -print -quit)"

      # The release path: the real mac.sign hook (scripts/sign-mac.cjs, osx-sign
      # and codesign) with an ad-hoc identity in place of the Developer ID, on a
      # copy so the disk image check below still sees the packaged app.
      - name: Signed dry-run through the release hook
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ditto "$(find apps/desktop/release -maxdepth 2 -name '*.app' -print -quit)" "$RUNNER_TEMP/dry-run.app"
          node apps/desktop/scripts/sign-mac-dry-run.cjs "$RUNNER_TEMP/dry-run.app"

      # One-click NSIS: a silent install must land per-user with no elevation,
      # create the shortcuts, and uninstall cleanly.
      - name: Install and uninstall the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem apps/desktop/release -Filter 'NekkoAgent-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No installer was built.' }
          "Installing $($installer.Name)"
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\@nekko-agentdesktop'
          if (-not (Test-Path $dir)) { $dir = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'NekkoAgent.exe') } | Select-Object -First 1 -ExpandProperty FullName }
          if (-not $dir -or -not (Test-Path (Join-Path $dir 'NekkoAgent.exe'))) { throw 'NekkoAgent.exe was not installed under %LOCALAPPDATA%\Programs.' }
          "Installed to $dir"
          $startMenu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcuts = @(Get-ChildItem $startMenu -Recurse -Filter 'Nekko Agent.lnk') + @(Get-ChildItem $desktop -Filter 'Nekko Agent.lnk' -ErrorAction SilentlyContinue)
          $shortcuts | ForEach-Object { "Shortcut: $($_.FullName)" }
          if ($shortcuts.Count -lt 2) { throw 'Expected a Start Menu and a desktop shortcut.' }
          # runAfterFinish starts the app after a silent install too; stop it so
          # the uninstaller is not blocked by a running process.
          Get-Process NekkoAgent -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $uninstaller = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'NekkoAgent.exe')) { throw 'Uninstall left NekkoAgent.exe behind.' }
          'Install and uninstall OK.'

      # The drag-to-install window: the background, the Finder layout and the
      # Applications link all have to make it into the image.
      - name: Check the macOS disk image layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find apps/desktop/release -maxdepth 1 -name 'NekkoAgent-*.dmg' -print -quit)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt"
          [ "$(basename "$mnt")" = 'Nekko Agent' ] || { echo "Volume is named '$(basename "$mnt")', expected 'Nekko Agent'." >&2; exit 1; }
          [ -f "$mnt/.background.tiff" ] || { echo 'No background image in the disk image.' >&2; exit 1; }
          [ -f "$mnt/.DS_Store" ] || { echo 'No Finder layout (.DS_Store) in the disk image.' >&2; exit 1; }
          [ "$(readlink "$mnt/Applications")" = '/Applications' ] || { echo 'No Applications link.' >&2; exit 1; }
          # HiDPI: the tiff must carry both the 1x and the 2x image.
          tiffutil -info "$mnt/.background.tiff" | tee /dev/stderr | grep -c 'Image Width' | grep -q 2
          ls -d "$mnt"/*.app

      # A nightly's installers stay workflow artifacts, never a GitHub release:
      # they are unsigned, and the desktop updater reads releases
      # (docs/decisions/0055). Uploaded only once the checks above passed.
      - name: Keep the nightly installers
        if: needs.version.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ needs.version.outputs.version }}-${{ runner.os }}
          path: |
            apps/desktop/release/NekkoAgent-*.exe
            apps/desktop/release/NekkoAgent-*.dmg
          retention-days: 14
          if-no-files-found: error
