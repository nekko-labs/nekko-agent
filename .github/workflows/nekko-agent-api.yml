name: nekko-agent-api

on:
  pull_request:
    paths:
      - "apps/nekko-agent-api/**"
      - ".github/workflows/nekko-agent-api.yml"
  push:
    branches: [main]
    paths:
      - "apps/nekko-agent-api/**"
      - ".github/workflows/nekko-agent-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nekko-agent-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nekko-agent-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
