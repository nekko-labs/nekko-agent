# Manual deploy of the Nekko Cloud services to Fly.io. Never runs on its own:
# it needs a person to dispatch it and, through the `production` environment,
# a required reviewer to approve it. Setup is in apps/nekko-agent-api/README.md
# (Deploy, "From GitHub Actions").
name: Deploy cloud

on:
  workflow_dispatch:
    inputs:
      service:
        description: Which service to deploy
        type: choice
        options: [api, relay]
        default: api

permissions:
  contents: read

concurrency:
  group: deploy-cloud-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: Deploy the API
        if: inputs.service == 'api'
        working-directory: apps/nekko-agent-api
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy the relay
        if: inputs.service == 'relay'
        run: flyctl deploy --remote-only --ha=false -c apps/relay-server/fly.toml --dockerfile apps/relay-server/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
