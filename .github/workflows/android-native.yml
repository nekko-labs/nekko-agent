name: Native Android
# The Kotlin / Jetpack Compose app in apps/android. JVM unit tests for the
# protocol and app logic, a cross-language E2E check against the agent's
# WebCrypto implementation, the live phone ↔ relay ↔ computer integration test,
# lint, and debug + release (unsigned, minified) builds.
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'apps/relay-server/**'
      - 'crates/nekko-remote/**'
      - 'crates/nekkod/src/remote.rs'
      - 'packages/shared/src/e2e.ts'
      - 'packages/shared/src/remote.ts'
      - 'packages/shared/src/ipc.ts'
      - 'packages/shared/src/pairing-link.ts'
      - '.github/workflows/android-native.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"
      - name: Build the relay and headless agent for the integration test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:core
          npm run build --workspace=apps/cli
          npm run build -w @nekko-agent/local-web-ui
          npm run build -w @nekko-agent/relay-server
      # Relay-agent mode runs on nekkod (found in target/ beside the checkout).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: phone-itest
      - run: cargo build -p nekkod --locked
      - name: Unit, cross-language and integration tests
        working-directory: apps/android
        env:
          NEKKO_ITEST: '1'
          NEKKO_E2E_OUT: ${{ runner.temp }}/kotlin-frames.json
        run: ./gradlew :protocol:test :app:testDebugUnitTest --console=plain
      - name: Agent opens Kotlin-sealed frames
        run: node apps/android/scripts/e2e-vector.mjs open "$RUNNER_TEMP/kotlin-frames.json"
      - name: Lint and build
        working-directory: apps/android
        run: ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            apps/android/protocol/build/reports/tests/
            apps/android/app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # AN-5: the app on an emulator, driven by Compose UI tests against the same
  # real relay + headless agent + fake model, with screenshots per step.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"
      - name: Build the relay and headless agent
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:core
          npm run build --workspace=apps/cli
          npm run build -w @nekko-agent/local-web-ui
          npm run build -w @nekko-agent/relay-server
      # Relay-agent mode runs on nekkod (found in target/ beside the checkout).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: phone-itest
      - run: cargo build -p nekkod --locked
      - name: Build the app and its UI tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Pair, stream, deny and answer on an emulator (light, dark)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: apps/android/scripts/emulator-journey.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: apps/android/evidence/**
          if-no-files-found: warn


  # AN-27: on an Android 16 QPR1 system, the running-chat notification
  # qualifies as a Live Update (the main emulator job runs API 34, which has no
  # such thing). Manual only for now: on the API 36 image no notification is
  # promotable, and on hosted runners the API 36.1 image boots but leaves user 0
  # locked, so the app can't start (TASKS AN-27). Run it by hand from Actions.
  live-update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"
      - name: Build the app and its tests
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      # Live Updates arrived in Android 16 QPR1 (API 36.1); on the API 36 image
      # no notification counts as promotable.
      - name: Live Update check on an API 36.1 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '36.1'
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: apps/android/scripts/live-update-check.sh
