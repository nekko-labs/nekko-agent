name: Native iOS
# macOS-only: the Team plan's 5 macOS runners are shared by every workflow (see
# ci.yml). Runs every 6 hours on main, and for `ci:macos` PRs in batches: one
# run on `ci/ios-batch` covers every open iOS PR that merges cleanly onto main
# (scripts/ios-batch.mjs, ios-batch.yml) and reports to each PR's head as the
# `Native iOS (batch)` status. On a PR itself it runs only when `ci:macos` or
# `ci:theme` is added, or by `gh workflow run ios-native.yml --ref <branch>`
# (to tell which PR broke a red batch); pushes do not re-run it.
# A PR or batch verifies dark mode only when it changes colours or a PR carries
# `ci:theme`; the schedule and a branch dispatch run light and dark.
on:
  pull_request:
    types: [labeled]
    paths:
      - 'apps/ios/**'
      - 'apps/relay-server/src/**'
      - 'crates/nekko-remote/**'
      - 'crates/nekkod/src/remote.rs'
      - 'packages/shared/src/phone-access.ts'
      - 'packages/shared/src/pairing-link.ts'
      - '.github/workflows/ios-native.yml'
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Set by ios-batch.yml: the PRs in this batch, [{"number":1,"sha":"..."}]'
        required: false
        default: ''
permissions:
  contents: read
  statuses: write
# One batch runs at a time and the newest waiting one replaces an older one, so a
# run of pushes costs one more batch, not one per push.
concurrency:
  group: ios-native-${{ inputs.batch && 'batch' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ !inputs.batch }}
jobs:
  protocol-and-build:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:macos') && contains(fromJSON('["ci:macos","ci:theme"]'), github.event.label.name))
    runs-on: macos-14
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out its merge commit and a batch is one commit on main:
          # either way HEAD^1 is the base, for the appearance scope.
          fetch-depth: 2
      - name: Use the newest installed Xcode
        run: |
          x="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -n1)"
          [ -n "$x" ] && sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version
          swift --version
      # Dark costs a second live journey (about 5 minutes), so a PR runs it only when
      # it changes colours (scripts/ios-theme-scope.mjs) or carries `ci:theme`.
      - name: Appearances to verify
        env:
          FORCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.batch) || contains(github.event.pull_request.labels.*.name, 'ci:theme') }}
        run: |
          if [ "$FORCE" = true ]; then THEMES='light dark'; else THEMES=$(git diff HEAD^1 HEAD -- apps/ios | node scripts/ios-theme-scope.mjs); fi
          echo "THEMES=$THEMES" | tee -a "$GITHUB_ENV"
      - name: Protocol and app-state tests (NekkoProtocol, NekkoKit)
        working-directory: apps/ios/Protocol
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the relay and a headless agent
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build:core
          npm run build --workspace=apps/cli
          npm run build -w @nekko-agent/local-web-ui
          npm run build -w @nekko-agent/relay-server
      # Relay-agent mode runs on nekkod (found in target/ beside the checkout).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: phone-itest
      - run: cargo build -p nekkod --locked
      - name: Phone ↔ relay ↔ computer over URLSessionTransport
        run: apps/ios/scripts/itest.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Validate plists
        run: |
          plutil -lint apps/ios/Info.plist apps/ios/Widgets/Info.plist apps/ios/App/NekkoNative.entitlements apps/ios/Widgets/NekkoWidgets.entitlements apps/ios/Share/Info.plist apps/ios/Share/NekkoShare.entitlements apps/ios/App/PrivacyInfo.xcprivacy apps/ios/Watch/PrivacyInfo.xcprivacy apps/ios/Watch/NekkoWatch.entitlements apps/ios/WatchWidgets/Info.plist apps/ios/WatchWidgets/NekkoWatchWidgets.entitlements apps/ios/WatchWidgets/PrivacyInfo.xcprivacy
      # Created, not booted: the build below needs its id. Booting it in the
      # background slowed whatever ran beside it (`swift test` 4.7x, the cargo build
      # 2.7x, the Xcode build 2.5x; nekkod failed to start beside the relay itest)
      # and saved about 17 s overall (runs 40132995453, 40136579251, 40138086476).
      - name: Create the simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | ruby -rjson -e 'puts JSON.parse(STDIN.read)["runtimes"].select { |r| r["isAvailable"] && r["identifier"].include?("iOS") }.last.fetch("identifier")')
          TYPE=$(xcrun simctl list devicetypes -j | ruby -rjson -e 't = JSON.parse(STDIN.read)["devicetypes"].map { |d| d["identifier"] }; puts(t.select { |i| i =~ /iPhone-1[5-9]-Pro$/ }.last || t.select { |i| i.include?("iPhone") }.last)')
          echo "DEVICE=$(xcrun simctl create Nekko-CI "$TYPE" "$RUNTIME")" >> "$GITHUB_ENV"
      # One build for the bundle checks and every test run below: for the test
      # device's architecture only, ad-hoc signed as the UI tests need.
      - name: Build the app and its tests for the simulator
        working-directory: apps/ios
        run: >-
          xcodebuild -project NekkoNative.xcodeproj -scheme NekkoNative
          -configuration Debug
          -destination "platform=iOS Simulator,id=$DEVICE"
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM=""
          COMPILER_INDEX_STORE_ENABLE=NO build-for-testing
      - name: Verify bundle (launch screen, widget and share extensions, URL schemes, icon, privacy manifest)
        run: |
          APP=apps/ios/DerivedData/Build/Products/Debug-iphonesimulator/NekkoNative.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' $APP/Info.plist)" = LaunchScreen
          test -d $APP/LaunchScreen.storyboardc
          test -d $APP/PlugIns/NekkoWidgets.appex
          # The Apple Watch glance ships inside the iPhone app, built for the watch simulator.
          test -d $APP/Watch/NekkoWatch.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' $APP/Watch/NekkoWatch.app/Info.plist)" = dev.nekkolabs.nekkoagent
          test -f $APP/Watch/NekkoWatch.app/PrivacyInfo.xcprivacy
          # Its watch face complication, a WidgetKit extension inside the watch app.
          W=$APP/Watch/NekkoWatch.app/PlugIns/NekkoWatchWidgets.appex
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' $W/Info.plist)" = com.apple.widgetkit-extension
          test -f $W/PrivacyInfo.xcprivacy
          # Share to Nekko: a share-services extension that takes text and one web link.
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' $APP/PlugIns/NekkoShare.appex/Info.plist)" = com.apple.share-services
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule:NSExtensionActivationSupportsText' $APP/PlugIns/NekkoShare.appex/Info.plist | grep -q true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes' $APP/Info.plist | grep -q nekko-agent-pair
          # App Store requirements: the icon compiled into the asset catalog, and the privacy manifest.
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' $APP/Info.plist)" = AppIcon
          test -f $APP/Assets.car
          plutil -lint $APP/PrivacyInfo.xcprivacy $APP/PlugIns/NekkoWidgets.appex/PrivacyInfo.xcprivacy $APP/PlugIns/NekkoShare.appex/PrivacyInfo.xcprivacy
      - name: Simulator tests and live screenshots (${{ env.THEMES }})
        working-directory: apps/ios
        run: |
          set -euo pipefail
          mkdir -p evidence
          trap 'xcrun simctl shutdown "$DEVICE" || true; xcrun simctl delete "$DEVICE" || true; kill ${NEKKO_ITEST_PIDS:-} 2>/dev/null || true' EXIT
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          COMMON=(-project NekkoNative.xcodeproj -scheme NekkoNative -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="")
          # Unit tests and first-run UI tests.
          # Every suite runs even when one fails, so one run shows every failure and keeps its evidence.
          failed=0
          # A failed live run prints its stack's own logs (fake model, relay, agent): the phone's
          # screenshots alone can't say why the computer stopped answering.
          stack_logs() { for f in "$NEKKO_ITEST_LOGDIR"/*.log; do echo "::group::$1 $(basename "$f")"; tail -n 120 "$f"; echo "::endgroup::"; done; }
          TEST_RUNNER_NEKKO_UI_THEMES="$THEMES" \
            xcodebuild "${COMMON[@]}" -resultBundlePath evidence/first-run.xcresult test-without-building -skip-testing:NekkoNativeUITests/LiveRelayTests || failed=1
          # The live journey, once per appearance, each against a fresh stack (pairing codes are single-use).
          for THEME in $THEMES; do
            xcrun simctl ui "$DEVICE" appearance "$THEME"
            ../../apps/ios/scripts/itest-stack.sh "/tmp/stack-$THEME.env"
            . "/tmp/stack-$THEME.env"
            TEST_RUNNER_NEKKO_ITEST_LINK="$NEKKO_ITEST_LINK" TEST_RUNNER_NEKKO_ITEST_THEME="$THEME" \
              xcodebuild "${COMMON[@]}" -resultBundlePath "evidence/live-$THEME.xcresult" test-without-building \
              -only-testing:NekkoNativeUITests/LiveRelayTests/testPairStreamAndApproveFromThePhone || { failed=1; stack_logs "live-$THEME"; }
            kill $NEKKO_ITEST_PIDS 2>/dev/null || true
            # The app is reinstalled per run; wipe it so the next theme pairs from scratch.
            xcrun simctl uninstall "$DEVICE" dev.nekkolabs.nekkoagent || true
          done
          # Offline mode: a prompt sent with the relay down waits, then goes exactly once when it is back.
          xcrun simctl ui "$DEVICE" appearance light
          ../../apps/ios/scripts/itest-stack.sh /tmp/stack-offline.env
          . /tmp/stack-offline.env
          TEST_RUNNER_NEKKO_ITEST_LINK="$NEKKO_ITEST_LINK" TEST_RUNNER_NEKKO_ITEST_RELAY_CTL="$NEKKO_ITEST_RELAY_CTL" \
            xcodebuild "${COMMON[@]}" -resultBundlePath evidence/offline.xcresult test-without-building \
            -only-testing:NekkoNativeUITests/LiveRelayTests/testSendWithTheRelayDownAndSeeItDelivered || { failed=1; stack_logs offline; }
          kill $NEKKO_ITEST_PIDS 2>/dev/null || true
          xcrun simctl uninstall "$DEVICE" dev.nekkolabs.nekkoagent || true
          # Beyond the chat (IO-22 to IO-29): queue edit, fork, Continue, an automation run, usage.
          ../../apps/ios/scripts/itest-stack.sh /tmp/stack-beyond.env
          . /tmp/stack-beyond.env
          TEST_RUNNER_NEKKO_ITEST_LINK="$NEKKO_ITEST_LINK" \
            xcodebuild "${COMMON[@]}" -resultBundlePath evidence/beyond.xcresult test-without-building \
            -only-testing:NekkoNativeUITests/LiveRelayTests/testQueueForkAutomationsAndUsageFromThePhone || failed=1
          kill $NEKKO_ITEST_PIDS 2>/dev/null || true
          xcrun simctl uninstall "$DEVICE" dev.nekkolabs.nekkoagent || true
          # The deep link from the computer's QR (Camera → nekko-agent-pair:) pairs through the confirmation sheet.
          xcrun simctl ui "$DEVICE" appearance light
          ../../apps/ios/scripts/itest-stack.sh /tmp/stack-link.env
          . /tmp/stack-link.env
          TEST_RUNNER_NEKKO_ITEST_LINK="$NEKKO_ITEST_LINK" \
            xcodebuild "${COMMON[@]}" -resultBundlePath evidence/deeplink.xcresult test-without-building \
            -only-testing:NekkoNativeUITests/LiveRelayTests/testPairFromADeepLink || { failed=1; stack_logs deeplink; }
          kill $NEKKO_ITEST_PIDS 2>/dev/null || true
          exit $failed
      - name: Export screenshots from the test results
        if: always()
        working-directory: apps/ios
        run: |
          mkdir -p evidence/shots
          for r in evidence/*.xcresult; do
            [ -d "$r" ] || continue
            xcrun xcresulttool export attachments --path "$r" --output-path "evidence/shots/$(basename "$r" .xcresult)" || true
          done
          find evidence/shots -name '*.png' | head -n 40
          # Small JPEG copies in the log, for reviewers who can't download artifacts.
          i=0
          find evidence/shots -name '*.png' | sort | while read -r f; do
            i=$((i+1)); [ "$i" -gt 40 ] && break
            sips -s format jpeg -s formatOptions 60 -Z 900 "$f" --out /tmp/shot.jpg >/dev/null 2>&1 || continue
            echo "SHOT-BEGIN $(basename "$(dirname "$f")")/$(basename "$f" .png)"
            base64 -i /tmp/shot.jpg | tr -d '\n'; echo
            echo "SHOT-END"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ios-evidence
          path: |
            apps/ios/evidence/shots/**
          if-no-files-found: warn
      - name: Report the batch to each PR
        if: always() && inputs.batch
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH: ${{ inputs.batch }}
          # A cancel (by hand, or the job's timeout) is not a test failure; it still blocks.
          STATE: ${{ job.status == 'success' && 'success' || job.status == 'cancelled' && 'error' || 'failure' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          prs=$(echo "$BATCH" | jq -r '[.[] | "#\(.number)"] | join(", ")')
          echo "$BATCH" | jq -r '.[].sha' | while read -r sha; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$STATE" -f context='Native iOS (batch)' \
              -f target_url="$URL" -f description="Native iOS $( [ "$STATE" = error ] && echo 'cancelled or timed out' || echo "$STATE") on the batch $prs"
          done
