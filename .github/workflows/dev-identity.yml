name: Development identity
# macOS-only: every 6 hours on main, or with the `ci:macos` label on a PR (ci.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'apps/desktop/scripts/dev-launch*'
      - 'apps/desktop/src/main/devLaunchProcess.ts'
      - 'apps/desktop/src/main/appIdentity*'
      - '.github/workflows/dev-identity.yml'
  schedule:
    - cron: '57 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-identity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  macos-native:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:macos')
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Signed bundle, native window, permission attribution and owned lifecycle
        working-directory: apps/desktop
        run: node scripts/dev-launch-smoke.mjs native-smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-development-identity
          path: apps/desktop/native-smoke/
          if-no-files-found: ignore
