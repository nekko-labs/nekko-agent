name: TurnDetails diagnostic contracts
on:
  pull_request:
    paths:
      - '.github/workflows/ios-native.yml'
      - '.github/workflows/ios-turn-details-contracts.yml'
      - 'scripts/ios-turn-details-diagnostic*'
      - 'scripts/ios-suite-shards*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-native.yml'
      - '.github/workflows/ios-turn-details-contracts.yml'
      - 'scripts/ios-turn-details-diagnostic*'
      - 'scripts/ios-suite-shards*'
permissions:
  contents: read
jobs:
  diagnostic-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/ios-turn-details-diagnostic.test.mjs scripts/ios-suite-shards.test.mjs
