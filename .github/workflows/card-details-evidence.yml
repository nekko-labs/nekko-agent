name: Card details evidence
on:
  pull_request:
    paths:
      - 'apps/ios/App/Views/ChatsView.swift'
      - 'apps/ios/App/Views/ChatGroupActivity.swift'
      - 'apps/android/app/src/main/java/com/nekko/android/ui/screens/ChatsScreen.kt'
      - 'apps/ios/scripts/GroupEvidenceTests.swift'
      - 'apps/android/app/src/androidTest/java/com/nekko/android/CardDetailsDeviceTest.kt'
      - '.github/workflows/card-details-evidence.yml'
permissions:
  contents: read
concurrency:
  group: card-details-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    uses: ./.github/workflows/ios-group-evidence.yml
    with:
      baseline_ref: ${{ github.event.pull_request.base.sha }}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        revision: [before, after]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision == 'before' && github.event.pull_request.base.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          path: .card-harness
          sparse-checkout: apps/android/app/src/androidTest/java/com/nekko/android/CardDetailsDeviceTest.kt
          sparse-checkout-cone-mode: false
      - run: |
          cp .card-harness/apps/android/app/src/androidTest/java/com/nekko/android/CardDetailsDeviceTest.kt apps/android/app/src/androidTest/java/com/nekko/android/
          mkdir -p apps/android/evidence
          echo "app=$(git rev-parse HEAD) harness=$(git -C .card-harness rev-parse HEAD)" > apps/android/evidence/revisions.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: SDK and isolated emulator support
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build actual native views and protocol tests
        working-directory: apps/android
        run: ./gradlew :protocol:test :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb install apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.nekko.android.CardDetailsDeviceTest -e baseline ${{ matrix.revision == 'before' && 'true' || 'false' }} com.nekko.native.android.test/androidx.test.runner.AndroidJUnitRunner | tee apps/android/evidence/result.txt
            adb pull /sdcard/Android/data/com.nekko.native.android/files/evidence apps/android/evidence/shots
            grep -q 'OK (1 test)' apps/android/evidence/result.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-card-details-${{ matrix.revision }}
          path: |
            apps/android/evidence/**
            apps/android/protocol/build/reports/tests/**
          if-no-files-found: error
