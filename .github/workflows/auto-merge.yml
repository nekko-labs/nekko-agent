name: Auto-merge
# Arms GitHub's native auto-merge (squash) on every ready PR into main, so it
# merges itself once `gate` and the other branch rules pass. There is no merge
# queue (removed 2026-11-06): the speed contract and itests run nightly, and
# `gate` on the PR is the last check before main. Then it closes the PR's
# linked issues.
#
# Draft and `hold` disarm it. With no queue to eject from, this workflow is what
# keeps a held PR from merging: adding `hold` or converting to draft turns
# auto-merge off, and removing `hold` or marking ready turns it back on.
#
# Only PRs based on main: a stacked layer targets the branch below it, and
# auto-merging it would fold it into that branch. Stacks land with
# `gh stack merge`.
#
# A merge no longer releases anything: releases start from a version tag a
# person pushes (docs/decisions/0055), so this no longer dispatches
# version-release.yml after the merge as it did when a package.json bump was
# the release trigger.
#
# Also on `synchronize`, so a newer push restarts the wait for the merge (and
# cancels the older one). queue-sweeper.yml re-arms a ready PR whose request
# went missing and re-runs a flaky `gate` once.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  # Needed to close the PR's linked issues: GitHub skips closing keywords on
  # merges made with GITHUB_TOKEN.
  issues: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hold:
    if: ${{ github.event.pull_request.base.ref == 'main' && (github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'hold')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disarm auto-merge on a draft or held PR
        run: gh pr merge --disable-auto "$PR_URL" || echo 'Auto-merge was not armed.'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  auto-merge:
    if: ${{ github.event.pull_request.base.ref == 'main' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'hold') }}
    runs-on: ubuntu-latest
    # Above the 40-minute wait below, so the timeout never turns this into a
    # red check on its own.
    timeout-minutes: 45
    steps:
      - name: Arm auto-merge
        run: gh pr merge --auto --squash "$PR_URL" || echo '::warning::Auto-merge not armed; queue-sweeper.yml retries.'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # Waits only while the PR can still merge on its own: auto-merge armed and
      # `gate` not red. Otherwise the job ends green rather than holding a
      # runner until the timeout shows a red `auto-merge` check (#787 did after
      # 45 minutes).
      - name: Close linked issues once merged
        run: |
          for _ in $(seq 1 120); do
            pr=$(gh pr view "$PR_URL" --json state,autoMergeRequest,statusCheckRollup 2>/dev/null || echo '{"state":"UNKNOWN"}')
            case "$(jq -r .state <<<"$pr")" in
              MERGED)
                # Closing keywords do nothing on a GITHUB_TOKEN merge, so close
                # linked issues here. Failures warn.
                issues=$(gh pr view "$PR_URL" --json closingIssuesReferences \
                  -q ".closingIssuesReferences[] | select(\"\(.repository.owner.login)/\(.repository.name)\" == \"$GH_REPO\") | .number") \
                  || echo "::warning::Could not read linked issues for $PR_URL."

                for n in $issues; do
                  issue_state=$(gh issue view "$n" --repo "$GH_REPO" --json state -q .state || echo UNKNOWN)
                  [ "$issue_state" = OPEN ] || continue
                  gh issue close "$n" --repo "$GH_REPO" --reason completed --comment "Fixed in #$PR_NUMBER." \
                    || echo "::warning::Could not close #$n."
                done

                # A merge that touched the iPhone app reaches TestFlight with
                # ios-testflight.yml's nightly run. No CI dispatch here: the
                # nightly full run covers every OS, the speed contract and the
                # itests (ci.yml).
                echo "Merged: $PR_URL"
                exit 0
                ;;
              CLOSED)
                echo "PR was closed without merging. Nothing to close."
                exit 0
                ;;
              OPEN)
                if [ "$(jq -r '.autoMergeRequest != null' <<<"$pr")" != true ]; then
                  echo "Auto-merge is not armed on $PR_URL, so not waiting."
                  exit 0
                fi
                gate=$(jq -r '[.statusCheckRollup[]? | select(.name == "gate")] | last | .conclusion // ""' <<<"$pr")
                case "$gate" in
                  FAILURE|CANCELLED|TIMED_OUT)
                    echo "gate is $gate. A fix push re-runs this job; queue-sweeper.yml re-runs a first-attempt failure once."
                    exit 0
                    ;;
                esac
                ;;
            esac
            sleep 20
          done
          echo "::warning::$PR_URL had not merged after 40 minutes, so its linked issues were not closed here."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # This job never checks out the repo, so gh has no git remote to infer
          # from. `gh pr view` survives that because it is given a full URL;
          # `gh issue` needs the repository named.
          GH_REPO: ${{ github.repository }}
