name: Auto-merge

# Turns on GitHub's native auto-merge for every ready PR into main. With the
# merge queue required on main, that adds the PR to the queue once its PR-tier
# checks pass; the queue runs the queue tier and merges. Then it makes sure the
# merge actually releases.
#
# Only PRs based on main: a stacked layer targets the branch below it, and
# auto-merging it would fold it into that branch rather than queue it. Stacks
# are queued with `gh stack merge`.
#
# No merge method on purpose. With a method (`--squash`), `gh pr merge --auto`
# arms GitHub's classic auto-merge, which waits outside the queue forever on a
# branch that requires one (#751 and #755 sat green and never queued). Without
# one, gh enqueues the PR, and the queue's own setting (squash) merges it.
#
# Why this also dispatches version-release: a merge performed with
# GITHUB_TOKEN never starts a workflow run, so the `push` trigger on
# version-release.yml has never once fired here. Every run in this repo's
# history is `schedule` or `workflow_dispatch`; the push path is dead on
# arrival for bot merges, which is what silently skipped v0.6.0's release and
# left v0.6.1 waiting for a hand dispatch. Waiting for the merge and
# dispatching explicitly is the same trick version-release already uses to
# reach release.yml and docker.yml. The schedule stays as the backstop.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # Needed to dispatch version-release.yml once the PR lands.
  actions: write
  # Needed to close the PR's linked issues: GitHub skips closing keywords on
  # merges made with GITHUB_TOKEN.
  issues: write

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    # Long enough to outlast the PR tier plus a queue run on a slow day, short
    # enough that a PR left open for review does not hold a runner all afternoon.
    timeout-minutes: 45
    steps:
      - name: Queue the PR
        run: gh pr merge --auto "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # Armed on `opened`, before any check has run, `--auto` on a queue-required
      # branch records an auto-merge request that GitHub does not always turn
      # into a queue entry when `gate` goes green (#756 sat 25 minutes like
      # that). So wait for `gate` here and enqueue explicitly once it passes;
      # an enqueue of a PR already in the queue is a no-op.
      - name: Enqueue once gate passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 60); do
            pr=$(gh pr view "$PR_URL" --json state,isDraft,headRefOid,statusCheckRollup)
            state=$(jq -r .state <<<"$pr")
            [ "$state" = OPEN ] || { echo "PR is $state."; exit 0; }
            if [ "$(jq -r .isDraft <<<"$pr")" = true ]; then echo 'Back in draft; not queueing.'; exit 0; fi
            gate=$(jq -r '[.statusCheckRollup[] | select(.name == "gate")] | last | .conclusion // ""' <<<"$pr")
            case "$gate" in
              SUCCESS)
                head=$(jq -r .headRefOid <<<"$pr")
                gh api graphql -f query='mutation($id:ID!,$head:GitObjectID){enqueuePullRequest(input:{pullRequestId:$id,expectedHeadOid:$head}){mergeQueueEntry{state position}}}' \
                  -f id="$PR_ID" -f head="$head" || echo '::warning::Enqueue failed; auto-merge stays armed.'
                exit 0
                ;;
              FAILURE|CANCELLED|TIMED_OUT)
                echo "gate is $gate; the author re-queues after a fix (push re-runs gate, then gh pr merge --auto)."
                exit 0
                ;;
            esac
            sleep 20
          done
          echo '::warning::gate did not finish within 20 minutes; auto-merge stays armed.'

      # Dispatched for every merge, not just version bumps: version-release is
      # idempotent (it stops when the version is already tagged), so a merge
      # that does not bump the version costs one no-op run and a merge that
      # does releases within seconds instead of waiting for the next tick.
      - name: Release the merge
        run: |
          for _ in $(seq 1 120); do
            state=$(gh pr view "$PR_URL" --json state -q .state 2>/dev/null || echo UNKNOWN)
            case "$state" in
              MERGED)
                # Closing keywords do nothing on a GITHUB_TOKEN merge, so close
                # linked issues here. Failures warn; the release still dispatches.
                issues=$(gh pr view "$PR_URL" --json closingIssuesReferences \
                  -q ".closingIssuesReferences[] | select(\"\(.repository.owner.login)/\(.repository.name)\" == \"$GH_REPO\") | .number") \
                  || echo "::warning::Could not read linked issues for $PR_URL."

                for n in $issues; do
                  issue_state=$(gh issue view "$n" --repo "$GH_REPO" --json state -q .state || echo UNKNOWN)
                  [ "$issue_state" = OPEN ] || continue
                  gh issue close "$n" --repo "$GH_REPO" --reason completed --comment "Fixed in #$PR_NUMBER." \
                    || echo "::warning::Could not close #$n."
                done

                gh workflow run version-release.yml --repo "$GH_REPO" --ref main
                # No CI dispatch here: the merge queue tested this exact group on
                # top of main before merging it, and the 6-hourly full run covers
                # macOS (ci.yml).
                echo "Merged. Dispatched version-release for $PR_URL"
                exit 0
                ;;
              CLOSED)
                echo "PR was closed without merging. Nothing to release."
                exit 0
                ;;
            esac
            sleep 20
          done
          echo "::warning::$PR_URL had not merged after 40 minutes, so no release was dispatched. The */15 schedule on version-release.yml remains the backstop."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # This job never checks out the repo, so gh has no git remote to infer
          # from. `gh pr view` survives that because it is given a full URL;
          # `gh workflow run` does not, and died with "not a git repository".
          GH_REPO: ${{ github.repository }}
